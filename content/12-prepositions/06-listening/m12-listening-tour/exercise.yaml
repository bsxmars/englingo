title: "Part 2: The Underground City tour"
type: listening
intro: "Послушай экскурсовода перед подземной экскурсией и впиши в каждый пропуск одно–три слова, которые прозвучали в записи."
hints:
  - "Слова вокруг пропуска — next to, in front of, during — помогут найти место в записи."
  - "Числа можно писать цифрами или словами."
audio: audio/tts/12/talk.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-AU-NatashaNeural", license: "TTS"}
transcript: |
  Good morning, everyone, and welcome to the Underground City tour. My name's Kate, and I'll be with you for the next ninety minutes.

  Before we go down, a few practical things. The tunnels are about fifteen metres below the street, and it's cold down there all year round, around ten degrees, so do keep your jackets on.

  The tunnels were dug in the 1780s, during the building of the Market Bridge. At first they were used as workshops by the shopkeepers above. But within thirty years the damp had got into everything, and the businesses moved out.

  After that, the poorest families in the city moved in. Some of them lived in a single room without windows for years. By the end of the century the tunnels had been filled with rubbish and forgotten.

  They were only found again in 1985, by a student who climbed through a hole in a cellar wall, completely by accident. He was actually looking for his cat!

  Now, the route. We'll go in through the door on your left, next to the souvenir shop, and walk down forty-two steps. Please hold on to the rail. At the bottom we'll stop in what we call the Cobbler's Room, because a shoemaker worked there for over twenty years.

  Halfway through the tour there's a short break in the Wine Vault, where you can sit on the old barrels.

  Photos are fine, but please don't use the flash, as it damages the walls.

  We'll come out on the opposite side of the street, in front of the library, at about half past eleven. If you lose the group at any point, don't panic. Just stay where you are until one of us comes back for you.

  Right, any questions? No? Then follow me, and mind your head!
