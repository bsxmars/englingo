text: |
  ## 48 hours in Porto: a weekend on foot

  I had been told that Porto is a city of hills, but nobody warned me just how steep they are. Within ten minutes of leaving my guesthouse, I was out of breath and wondering why I hadn't packed better shoes. By Sunday evening, though, I had forgiven the hills completely. Porto is small enough to explore on foot in a weekend, and almost every climb ends with a view that makes it worth it.

  **Saturday morning**

  Start at São Bento station, even if you're not catching a train. The main hall is covered from floor to ceiling in blue and white tiles that tell stories from Portuguese history. Get there before nine, when it's still quiet; by eleven, the hall is full of tour groups with their phones in the air. From the station, it's a short walk downhill to the Ribeira, the old riverside district. Here, narrow streets lead down to the Douro river, and colourful houses lean against each other as if they were tired.

  **Saturday afternoon**

  After lunch, walk across the Dom Luís I bridge. It has two decks: cars and pedestrians use the lower one, while metro trains and pedestrians share the upper one, high above the water. Take the upper deck if you aren't afraid of heights — the view of the old town is unforgettable. On the other side of the river is Vila Nova de Gaia, which is technically a separate city. This is where the famous port wine has been stored for centuries, in cellars along the water. Most cellars offer tours with a tasting at the end, but book in advance at weekends, because the popular ones are often full by midday.

  **Saturday evening**

  As the sun goes down, climb up to the viewpoint next to the monastery on the Gaia side of the bridge. You'll find half the city there, sitting on the low wall with a drink and waiting for the sky to turn pink. Then head back across the river for dinner. If you're brave, order a *francesinha*, a huge sandwich filled with several kinds of meat, covered in melted cheese and served in a hot sauce. You won't need breakfast.

  **Sunday**

  On Sunday morning, visit the Livraria Lello, often described as one of the most beautiful bookshops in the world. Be warned: you have to buy a ticket to get in, and there is usually a long queue outside. Is it worth it? On the whole, yes — the red staircase in the middle of the shop is extraordinary — but go early or you'll spend more time in the queue than among the books.

  In the afternoon, rest your legs. Take the old tram number 1, which rattles along the river towards the Atlantic. The ride takes about twenty minutes, and at the end of the line you can walk by the ocean or simply sit at a café and watch the waves.

  **Getting there and around**

  The airport is about half an hour from the centre by metro, and it runs until late at night. Inside the city, though, forget about transport. Porto rewards people who wander at their own pace, get lost in its back streets and climb one more hill than they planned to.
