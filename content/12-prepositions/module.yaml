title: "12. Предлоги"
summary: "Перестаёшь переводить «в» и «на» дословно: уверенно выбираешь in / on / at для места и времени, различаешь for / since / ago, during / while, by / until, as / like и знаешь устойчивые сочетания вроде proud of, reason for, on purpose."
topics:
  - "Предлоги места и движения; in / on / at для места"
  - "in / on / at для времени, in time и on time"
  - "for / since / ago / before, during / while, by / until, as / like / as if"
  - "Предлог + существительное (on holiday, by mistake), существительное и прилагательное + предлог (reason for, proud of)"
  - "Зависимые предлоги, которые меняют смысл (concerned about / with, good at / for / to / with); глагол без предлога и существительное с предлогом (discuss → discussion about)"
