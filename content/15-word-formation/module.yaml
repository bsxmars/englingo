title: "15. Словообразование"
summary: "Видишь в слове корень и суффикс, по месту в предложении понимаешь, какая часть речи нужна, и уверенно образуешь существительные, прилагательные, наречия и отрицательные формы — как в B2 First Use of English, Part 3."
topics:
  - "Части речи: как по месту в предложении понять, какое слово нужно"
  - "Суффиксы существительных: -tion, -ment, -ness, -ity, -ance / -ence, -er / -or / -ist, -ship, -hood"
  - "Суффиксы прилагательных и наречий: -ful / -less, -able / -ible, -ive, -ous, -al, -ic, -y, -ly"
  - "Приставки: un- / in- / im- / il- / ir- / dis- / mis-, re-, over- / under-; формат Part 3"
  - "Глаголы на -en / en- / -ise / -ify; отрицательные цепочки в контексте (unbelievably, dissatisfied)"
sources:
  - {title: "Oxford Practice Grammar — части речи и словообразование (приложение)", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Cambridge B2 First — формат экзамена (Use of English, Part 3)", url: "https://www.cambridgeenglish.org/exams-and-tests/first/"}
  - {title: "englisch-hilfen — упражнения по грамматике и лексике", url: "https://www.englisch-hilfen.de/en/exercises_list/alle_grammar.htm"}
