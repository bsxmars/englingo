title: "C1 · 7. Местоимения, замена и эллипсис"
level: c1
book: book-advanced
summary: "Говоришь о «людях вообще» без канцелярита, связываешь абзацы через this и that, строишь фразы с пустыми it и there (It's no use…, There seems to be…) и избегаешь повторов: so, not, one, do so и пропуск слов там, где носитель их опускает."
topics:
  - "Generic you / we / one / they, he or she и singular they, a friend of mine"
  - "this / that для отсылки к идеям, indefinite pronouns, reflexive и reciprocal"
  - "Пустое it: It's no use…, It seems that…, I find it odd that…"
  - "Пустое there: There seems to be…, There are thought to be…"
  - "Замена: one / ones, so / not, do so"
  - "Эллипсис: I'd like to, but I can't; She said she would, and she did"
  - "Эллипсис в глубину: выбор вспомогательного, so do I / neither have I, than was expected, if necessary / though tired"
sources:
  - {title: "Oxford Practice Grammar Advanced — местоимения, замена и эллипсис", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
