title: "Part 4: Sharing a home"
type: listening
intro: "Ты услышишь пять коротких монологов о том, каково жить с людьми, которые не родственники. Задание 1: почему каждый начал жить с соседями? Задание 2: чему это его научило? В каждом задании восемь вариантов, три лишние."
hints:
  - "На первом прослушивании держи в голове задание 1, на втором — задание 2."
  - "Говорящие часто называют сначала очевидную причину, а потом настоящую: but, actually, what I've discovered is…"
