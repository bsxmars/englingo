audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-GB-RyanNeural, en-US-JennyNeural, en-IE-ConnorNeural, en-AU-NatashaNeural, en-GB-LibbyNeural", license: "TTS"}
transcript: |
  **Speaker 1:** I'd been freelancing from home for years, which was fine until the work dried up and I took a contract in the city. Suddenly I needed a room near the office four nights a week, and a whole flat to myself would've been absurd. So I answered an ad. People assume it was about the money, and to some extent it was, but mainly it was about the commute. What took me a while to learn was speaking up. For months, one of the others kept leaving his bike in the hall, and I'd squeeze past it every morning, muttering to myself. When I finally mentioned it, he said, "Oh, sorry, nobody told me." And nobody had. Since then, if something bothers me, I say so. Politely, but I say so.

  **Speaker 2:** My neighbor, an elderly widow, had a spare room, and her kids were worried about her being on her own. I was between apartments anyway, so I offered to move in for a few months. That was three years ago. I'd always thought of myself as someone who needed people around. I'd had roommates all through college, and I loved it. But what I've discovered is that I actually need a door I can close. She goes to bed at nine, and those quiet evenings have become the best part of my day. I'd never have guessed that about myself.

  **Speaker 3:** After my marriage broke up, I couldn't face an empty house, so when an old school friend of mine said he had a room going, I jumped at it. Everyone warned us that living with a mate is the quickest way to lose one, and we've had our moments, but we're still friends. What it's done is show me how much I'd left to my wife over the years. Cooking, bills, remembering birthdays. I'd assumed they just happened. Living with Declan, who's even worse at that sort of thing than I am, I've had to do it all myself, and, to be honest, I'm a bit ashamed it took me forty-five years to notice.

  **Speaker 4:** I'm saving for a deposit on a place of my own, and in Sydney that means either sharing or moving back in with my parents, and I wasn't going to do that again. There are five of us in the house. The first thing we did was draw up a cleaning rota, with colour-coded columns and everything. It lasted about a fortnight. Then someone went on holiday, someone else had exams, and nobody's looked at it since. What actually keeps the place clean is that each of us just does a bit when we notice it needs doing. Rules look good on the fridge, but that's about all they do.

  **Speaker 5:** I'd never have considered it myself, but my best friend Priya was moving to Bristol, and she kept on at me until I agreed to come too. I was nervous, because I'm quite particular about how things are done, and Priya isn't. She leaves half-empty cups everywhere. At first it drove me mad. But I've come to realise that her standards aren't lower than mine; they're just different. She'd never leave a bill unpaid, for instance, which I sometimes do. So I've relaxed about the cups. Mostly.
