transcript: |
  Hello everyone. I'd like to tell you about the summer I spent as a volunteer at a small farm in Wales.

  I had never worked outside before. For six years I had been sitting in an office in London, so the first week was a real shock.

  We got up at half past five every morning. The first job of the day was always feeding the goats, and there were thirty-two of them.

  The farmer, a woman called Gwen, had been running the place on her own since her husband died. She used to say that the animals were better company than most people.

  The thing I found hardest wasn't the physical work. It was the silence. In the evenings there was no internet and no traffic, only the wind.

  By August, though, I'd got used to it. I had learnt to make cheese, and I had even started to understand a little Welsh.

  I've been back in London for two years now, but I still go to the farm every spring to help with the lambs.

  If you're thinking about volunteering, my advice is simple: choose something completely different from your normal life.
