title: "6. Косвенная речь"
summary: "Пересказываешь чужие слова, вопросы и просьбы без ошибок в порядке слов и временах и используешь глаголы вроде suggest, admit, refuse вместо бесконечного said."
topics:
  - "say и tell, сдвиг времён"
  - "Модальные, условные и wish в косвенной речи; Shall I…? → offered to"
  - "Косвенные вопросы, просьбы и приказы"
  - "Reporting verbs: suggest, advise, admit, deny, refuse, accuse of…"
sources:
  - {title: "Oxford Practice Grammar — разделы о косвенной речи", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
