title: "Part 3: A night on the mountain"
type: listening
intro: "Послушай радиоинтервью с Кирсти Роу, волонтёром горноспасательной службы, и выбери ответ. Вопросы идут по порядку записи."
hints:
  - "Все четыре варианта звучат правдоподобно: ищи тот, что совпадает с позицией самой Кирсти, а не с тем, что «думают все»."
  - "I wouldn't go that far — частичное несогласие: говорящий принимает идею, но с оговоркой."
