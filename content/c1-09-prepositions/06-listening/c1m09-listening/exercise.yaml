    answer: 1
    explain: "*People use them instead of a map rather than as well as one.* Предлоги — суть мнения: *instead of* (вместо) — плохо, *as well as* (вместе с) — хорошо. *I wouldn't go that far* отвергает идею, что телефоны — проблема."
