transcript: |
  **Presenter:** My guest today is Kirsty Rowe, who has been a volunteer with a mountain rescue team in the Scottish Highlands for almost a decade. Kirsty, you grew up in Australia. How did you end up on a Scottish mountain at three in the morning?

  **Kirsty:** Well, it certainly wasn't part of a plan. I came over on a working holiday, and I was only meant to stay for a year. I got a job in a hotel at the foot of a mountain, and one night a couple of walkers came off the hill soaking wet, well after dark. The rescue team had brought them down, and I made everyone tea in the kitchen. I got talking to the team leader, and by the end of the night I'd more or less signed up.

  **Presenter:** Just like that?

  **Kirsty:** Not quite. The training takes about eighteen months, and you're on probation throughout. There's navigation, first aid, rope work. But what struck me that first night was that none of them were being paid. They'd come straight from their day jobs: a plumber, a teacher, a vet. I found that extraordinary, and I still do.

  **Presenter:** People might imagine that most of your call-outs involve dramatic rescues off cliffs.

  **Kirsty:** That's what everyone assumes. In reality, the majority are people who've simply lost their way. They've set off along a path in good weather, the cloud has come down, and suddenly they can't see more than ten metres in front of them. And very often they're relying on a phone, which runs out of battery just when they need it most.

  **Presenter:** So is technology the problem?

  **Kirsty:** I wouldn't go that far. Phones save lives, there's no doubt about that. A walker who can send us their location saves us hours of searching. The problem is that people use them instead of a map rather than as well as one. If you can't read the ground around you, a blue dot on a screen won't tell you there's a river between you and the car park.

  **Presenter:** Tell me about a rescue that's stayed with you.

  **Kirsty:** There was one, about four years ago, in the middle of January. A man had gone out alone, and his wife reported him missing when he hadn't come back by six. We searched through the night. By about four in the morning, most of us had privately given up hope, though nobody said so out loud. And then one of our dogs found him, curled up under a rock, about two hundred metres off the path. He was very cold, but he was talking. What I remember most isn't the moment we found him, though. It's his wife at the hospital, thanking every single one of us, one by one, including the dog.

  **Presenter:** Does the work take its toll on you personally?

  **Kirsty:** It does, sometimes. Not every story ends like that one. The team's very good about talking things through afterwards, and we look out for each other. But I'd be lying if I said I never lie awake after a bad call-out. My partner has got used to me jumping out of bed in the middle of the night, though I'm not sure he'd say he's ever got used to waiting up for me.

  **Presenter:** Finally, what advice would you give to anyone heading into the hills this weekend?

  **Kirsty:** Three things. Tell someone where you're going and when you'll be back. Take a paper map and a compass, and know how to use them. And, above all, be prepared to turn back. The mountain will still be there next week. A lot of the people we bring down got into trouble because they pressed on when every sign was telling them not to. Turning back isn't a failure. It's a decision.

  **Presenter:** Kirsty Rowe, thank you.
