level: c1
book: book-advanced
title: "C1 · 9. Предлоги"
summary: "Выбираешь предлог не по переводу, а по смыслу: by или until, above или over, between или among, except или except for, with или by. Уверенно используешь зависимые предлоги (ban on, indulge in, fraught with) и фразовые глаголы C1 с переносным значением — и знаешь, когда в формальном тексте их лучше заменить одним глаголом."
topics:
  - "Простые и составные предлоги, предлог в конце вопроса и придаточного"
  - "Время: by / until, during / for / in, since before, until after"
  - "Место и шкала: at / in / on, above / over, below / under, between / among; глагол и существительное + предлог"
  - "Зависимые предлоги: глагол без предлога и существительное с предлогом, verb + object + preposition, предлог меняет смысл, to + -ing, составные предлоги"
  - "Движение: across / over / through, along / past, off / out of в прямом и переносном смысле"
  - "of / with / by; except (for), besides, apart from, without, minus"
  - "Фразовые глаголы C1: переносные значения, three-word verbs, регистр"
