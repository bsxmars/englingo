transcript: |
  **Presenter:** My guest on Outdoor Hour is Jess Kowalski, who has been a volunteer with a mountain rescue team in the Lake District for eleven years. Jess, you grew up in Sydney. How did you end up on a hillside in Cumbria?

  **Jess:** Ha, by accident, like most things in my life. I came over on a two-year work visa, and the moment I saw the hills, I knew I wasn't going home. I'd hardly unpacked when I joined a walking club, and one of the members turned out to be the local team leader. Seeing that I'd done a fair bit of climbing back home, he suggested I come along to a training night.

  **Presenter:** And what does the training involve?

  **Jess:** Far more than people imagine. Before you're allowed on a real call-out, you spend about a year as a trainee, learning first aid, navigation, rope work. Once qualified, you're on call twenty-four hours a day, so that whenever the pager goes off, there's always someone who can be on the hill within the hour.

  **Presenter:** That must be hard to combine with a job.

  **Jess:** It is, and I'm lucky in that my employer is incredibly understanding. I teach in a secondary school, and if necessary, a colleague covers my lessons. Much as I love the rescue work, I simply couldn't do it without that goodwill. I try never to take it for granted.

  **Presenter:** What kind of incidents do you deal with most?

  **Jess:** People tend to picture dramatic falls from cliffs. In reality, most of our call-outs are walkers who've slipped and twisted an ankle, or who've simply got lost as the light faded. A lot of people set off as though they were going for a stroll in the park. Trainers, no map, and a phone on ten per cent battery.

  **Presenter:** Is that frustrating?

  **Jess:** I wouldn't say frustrating, no. We'd far rather people called us early than waited until they were in real trouble. In my very first week, my team leader told me never to make anyone feel stupid for asking for help, lest they hesitate the next time. I've never forgotten that.

  **Presenter:** Is there one rescue that's stayed with you?

  **Jess:** There is. A teenager went missing on a winter afternoon, and the weather was so bad that the helicopter couldn't fly. We searched for six hours, in the dark, in sleet. Exhausted as we were, nobody suggested stopping. When we finally found him, sheltering behind a stone wall, he looked up at us as if we'd been gone for five minutes and asked whether anyone had brought any chocolate.

  **Presenter:** And had anyone?

  **Jess:** Of course. It's on the kit list.

  **Presenter:** What would you say to someone who's thinking of volunteering?

  **Jess:** Do it, but go in with your eyes open. It isn't glamorous. Now that the team's busier than ever, what we really need isn't heroes. It's people who'll turn up reliably, month after month, and do the dull jobs, checking the radios, washing the vehicles, so that the exciting ones can happen at all.

  **Presenter:** Jess Kowalski, thank you.
