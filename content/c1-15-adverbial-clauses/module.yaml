title: "C1 · 15. Обстоятельственные придаточные"
level: c1
book: book-advanced
summary: "Связываешь мысли точными союзами: as и just as, no sooner… than, as if + were, in that и seeing that, so that и lest, so… that и such… that, much as и Tired as she was, а также сокращённые обороты While waiting, Once finished, If necessary — без висячих причастий."
topics:
  - "Время: when / while / as / just as, once, the moment, until, since; no sooner… than, hardly… when"
  - "Образ действия: as, just as, as if / as though + Past или were, like"
  - "Причина, цель, результат: as, since, now that, seeing that, in that, for; so that, in order that, lest; so… that, such… that"
  - "Уступка: although, even though, whereas, much as, Tired as she was; сокращённые придаточные: While waiting, Having finished, Once submitted, If necessary"
  - "Причастные и абсолютные обороты: выбор формы (having done, having been done), смысл без союза, The meeting over, There being, Weather permitting, with + сущ. + -ing; висячие причастия"
sources:
  - {title: "Oxford Practice Grammar Advanced — Adverbial clauses", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
