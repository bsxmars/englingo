title: "Найди ошибку: неестественная коллокация"
type: error
intro: "В каждом предложении **одно** слово образует неестественное сочетание — грамматически всё верно, но носитель так не скажет. Замени его и отправь предложение целиком."
hints:
  - "Проверь пары глагол + существительное: make / do / take / pay / raise / reach / draw / meet / pose."
  - "Проверь усилители: heavy rain, strong wind, bitterly disappointed, highly unlikely, seriously injured."
items:
  - q: "The committee is expected to make a final verdict by the end of the week."
    answers:
      - "The committee is expected to reach a final verdict by the end of the week."
      - "The committee is expected to deliver a final verdict by the end of the week."
      - "The committee is expected to return a final verdict by the end of the week."
      - "The committee is expected to give a final verdict by the end of the week."
    explain: "Вердикт «выносят» как итог обсуждения: **reach a verdict** (присяжные также *return / deliver a verdict*). ~~make a verdict~~ — калька с «вынести»."
  - q: "Heavy winds brought down power lines across the north of the country."
    answers:
      - "Strong winds brought down power lines across the north of the country."
      - "High winds brought down power lines across the north of the country."
    explain: "Ветер — **strong** или **high**, а *heavy* — дождь, снег, туман: *heavy rain, heavy snow*."
  - q: "The new law has done a lot of discussion among legal experts."
    answers:
      - "The new law has generated a lot of discussion among legal experts."
      - "The new law has prompted a lot of discussion among legal experts."
      - "The new law has provoked a lot of discussion among legal experts."
      - "The new law has sparked a lot of discussion among legal experts."
      - "The new law has caused a lot of discussion among legal experts."
      - "The new law has stimulated a lot of discussion among legal experts."
    explain: "Обсуждение «вызывают»: **generate / prompt / spark / provoke discussion**. *do* с *discussion* не сочетается."
  - q: "Please take attention to the safety instructions before using the machine."
    answers: ["Please pay attention to the safety instructions before using the machine."]
    explain: "**pay attention to** — единственный глагол. ~~take attention~~ и ~~give attention~~ — кальки."
  - q: "The minister was highly disappointed by the outcome of the vote."
    answers:
      - "The minister was bitterly disappointed by the outcome of the vote."
      - "The minister was deeply disappointed by the outcome of the vote."
      - "The minister was very disappointed by the outcome of the vote."
      - "The minister was extremely disappointed by the outcome of the vote."
      - "The minister was sorely disappointed by the outcome of the vote."
      - "The minister was bitterly disappointed with the outcome of the vote."
    explain: "*disappointed* сочетается с **bitterly / deeply / sorely**. *highly* — с *unlikely, successful, recommended*."
  - q: "Smoking makes serious harm to the lungs of unborn children."
    answers:
      - "Smoking does serious harm to the lungs of unborn children."
      - "Smoking causes serious harm to the lungs of unborn children."
    explain: "**do harm / damage** (или нейтральное *cause harm*). ~~make harm~~ — калька с «причинять»."
  - q: "Several studies have pointed to a strong difference between the two groups."
    answers:
      - "Several studies have pointed to a significant difference between the two groups."
      - "Several studies have pointed to a marked difference between the two groups."
      - "Several studies have pointed to a considerable difference between the two groups."
      - "Several studies have pointed to a substantial difference between the two groups."
      - "Several studies have pointed to a big difference between the two groups."
      - "Several studies have pointed to a striking difference between the two groups."
      - "Several studies have pointed to a clear difference between the two groups."
    explain: "Большая разница — **a significant / marked / considerable difference**. *strong* сочетается с *accent, wind, argument*, но не с *difference*."
  - q: "The researchers hope their findings will rise awareness of the disease among GPs."
    answers: ["The researchers hope their findings will raise awareness of the disease among GPs."]
    explain: "Переходный глагол — **raise** (*raise awareness*). *rise* непереходный: *awareness rose*."
  - q: "It took the jury nine hours to come to a consensus."
    answers:
      - "It took the jury nine hours to reach a consensus."
      - "It took the jury nine hours to arrive at a consensus."
      - "It took the jury nine hours to achieve a consensus."
      - "It took the jury nine hours to reach consensus."
    explain: "Стандартная коллокация — **reach a consensus** (формально *arrive at*). *come to* естественно с *a decision, an agreement, a conclusion*, а с *consensus* звучит непривычно."
  - q: "She made a heavy contribution to the success of the project."
    answers:
      - "She made a significant contribution to the success of the project."
      - "She made a major contribution to the success of the project."
      - "She made a huge contribution to the success of the project."
      - "She made a substantial contribution to the success of the project."
      - "She made a valuable contribution to the success of the project."
      - "She made a considerable contribution to the success of the project."
      - "She made an enormous contribution to the success of the project."
      - "She made a big contribution to the success of the project."
      - "She made an important contribution to the success of the project."
      - "She made a great contribution to the success of the project."
    explain: "Вклад бывает **significant / major / valuable / substantial**. *heavy* — про дождь, курильщика, потери (*heavy losses*), но не про вклад."
  - q: "The government has been criticised for failing to make action on air pollution."
    answers: ["The government has been criticised for failing to take action on air pollution."]
    explain: "**take action** — «принимать меры». Как и *take steps / measures*: в этом гнезде глагол всегда *take*."
