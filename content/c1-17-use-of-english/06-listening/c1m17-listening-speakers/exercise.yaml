title: "Part 4: An interview to remember"
type: listening
intro: |
  Пять человек вспоминают собеседование, которое пошло не по плану. В **Task 1** выбери, что неожиданного произошло, в **Task 2** — какой урок каждый извлёк. В каждой задаче три варианта лишние.
hints:
  - "Говорящие пользуются идиомами и коллокациями: take it in my stride, draw a blank, on the verge of — переведи их в смысл вариантов."
  - "Вывод обычно звучит в конце монолога: Since then…, Now…, These days…"
