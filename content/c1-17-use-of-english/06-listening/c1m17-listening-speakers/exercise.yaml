transcript: |
  *Speaker one.*

  It was a video interview, and I'd done my research thoroughly, so I felt fairly confident. About ten minutes in, just as I was making what I thought was a really strong point, my connection dropped. When I got back in, I'd completely lost my train of thought. I could have panicked, but instead I apologised, took a deep breath and simply started the answer again. Afterwards, the manager told me that the way I'd handled it had made a far better impression than the answer itself. Since then, whenever something goes wrong, I try to take it in my stride.

  *Speaker two.*

  On my CV I'd described myself as a keen chess player, which, to be honest, was stretching the truth. I'd played maybe a dozen times. At first I thought the interviewer had lost interest in me altogether; she kept glancing at her notes. Then she looked up and said, I see you play chess, I'm a club champion, what's your favourite opening? I drew a complete blank. She was very gracious about it, and I did get a second interview, but I've never felt so embarrassed in my life. Everything on my CV now is something I could talk about for an hour.

  *Speaker three.*

  I'd been told there'd be two people on the panel. I very nearly went to the wrong building, but that's another story. When I finally walked into the room, there were seven of them, sitting in a row, and only one empty chair. Without really thinking, I said, should I wait for the rest of you to arrive? There was a pause, and then they all burst out laughing. From that moment the whole atmosphere changed. I'd prepared some clever questions to ask them at the end, but in the event we ran out of time. What really made the difference was that one joke.

  *Speaker four.*

  I walked in, shook hands with the interviewer, and something about him seemed oddly familiar. Halfway through, he leaned back and said, you don't remember me, do you? We'd sat next to each other in maths for two years at school. I was mortified. If I'd bothered to look at the company website, I'd have seen his photo on the team page and been ready for it. Instead I spent the rest of the interview trying to remember whether I'd ever been rude to him. I've learnt my lesson: these days I find out everything I can about an organisation, and the people in it, beforehand.

  *Speaker five.*

  The interviewer asked for my views on remote working, and when I gave them, she disagreed quite sharply. I later found out she does this with every candidate deliberately, to see how they react under pressure. At the time, though, I was on the verge of snapping back at her. Fortunately, something made me stop and count to three before I answered. They also asked me about my weaknesses, and I was honest about those, but that isn't what the job turned on. It was that pause. Now, whenever I'm challenged, I make a point of giving myself a moment before I reply.
