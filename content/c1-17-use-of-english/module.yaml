title: "C1 · 17. Use of English: лексика и формат экзамена"
level: c1
book: book-advanced
summary: "Готовишься к Use of English в C1 Advanced: знаешь сильные коллокации (raise concerns, draw a conclusion, bitterly disappointed) и зависимые предлоги, уверенно решаешь open cloze, word formation и трансформации, читаешь тексты с несколькими мнениями и пишешь proposal."
topics:
  - "Коллокации: verb + noun, adjective + noun, adverb + adjective"
  - "Зависимые предлоги C1: in favour of, on the verge of, at odds with, with regard to"
  - "Open cloze (Part 2): артикли, предлоги, связки, местоимения, вспомогательные"
  - "Word formation (Part 3): приставки, цепочки суффиксов, отрицательные формы"
  - "Key word transformations (Part 4)"
  - "Multiple-choice cloze (Part 1): коллокации, устойчивые фразы, близкие синонимы"
  - "Reading Part 6: сравнение мнений; proposal"
sources:
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
  - {title: "Perfect English Grammar: make или do", url: "https://www.perfect-english-grammar.com/make-or-do-exercise-1.html"}
  - {title: "Perfect English Grammar: прилагательные и предлоги", url: "https://www.perfect-english-grammar.com/adjectives-and-prepositions-exercise-1.html"}
  - {title: "Perfect English Grammar: глаголы и предлоги", url: "https://www.perfect-english-grammar.com/verbs-and-prepositions-exercise-1.html"}
