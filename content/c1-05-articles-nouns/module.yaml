title: "C1 · 5. Артикли и существительные"
level: c1
book: book-advanced
summary: "Выбираешь артикль не по правилу «первое упоминание — a», а по смыслу: классифицируешь или идентифицируешь, говоришь о виде целиком (the tiger, tigers) или об отдельном представителе. Уверенно согласуешь group, pair и plural nouns, выбираешь между 's, of и составным существительным и связываешь текст через артикли: the incident, the move, the kitchen."
topics:
  - "a/an — классификация, the — идентификация; generic reference: a tiger, the tiger, tigers"
  - "a/an или one, a/an или нулевой артикль с абстрактными существительными, the или нулевой артикль"
  - "the или нулевой артикль: географические названия, институции (in hospital, to prison), транспорт, устойчивые формулы, заголовки"
  - "Исчисляемые и неисчисляемые значения; pair, group, plural-only и singular (+s) nouns; согласование"
  - "Possessive ('s), of-phrase или compound noun; double possessive; a ten-minute walk"
  - "Артикли в дискурсе: новая и известная информация, перефразирование, ассоциативная связь, сжатые compounds"
sources:
  - {title: "Oxford Practice Grammar Advanced — артикли и существительные", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
