title: "Part 2: The story of the pencil"
type: listening
intro: "Послушай вступительную речь экскурсовода в музее карандаша и впиши в каждый пропуск одно–три слова, которые прозвучали в записи."
hints:
  - "Артикль и предлог перед пропуском подсказывают форму слова."
  - "Британское и американское написание засчитываются оба."
audio: audio/tts/c1-05/talk.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-AU-NatashaNeural", license: "TTS"}
transcript: |
  Hello, everyone, and welcome to the museum. Before you go into the main gallery, I'd like to tell you a little about the object this whole building is devoted to: the pencil.

  It's an object most of us barely notice. The average household probably owns a dozen pencils without anyone being able to say where a single one of them came from. But the story begins not far from here, in the sixteenth century, in a valley in the Lake District called Borrowdale. A storm is said to have brought down a tree, and local shepherds found a strange black substance in the earth beneath its roots. They used it to mark their sheep.

  That substance was graphite, and for a long time it was the purest deposit of graphite known anywhere in the world. It became so valuable that the mine was guarded by armed men, and stealing from it was a crime that could get you sent to prison.

  At first, graphite was simply wrapped in string or sheepskin, so that people didn't get their hands dirty. The idea of putting it inside a wooden case came later, and the wood that was used, and still is in the best pencils, is cedar, because it's soft enough to sharpen easily and it doesn't split.

  One thing that always surprises visitors is that there has never been any lead in a pencil. Not a trace. The word comes from an old mistake. People thought graphite was a kind of lead, and the name simply stuck.

  The modern pencil is really a French invention. At the end of the eighteenth century, during a war with Britain, France could no longer get hold of English graphite, and an engineer called Conté found a way of mixing powdered graphite with clay. The more clay you add, the harder the pencil, and that's why pencils are still graded with letters and numbers today.

  In the gallery you'll also see what's claimed to be one of the longest coloured pencils in the world. It's nearly eight metres long and weighs almost half a tonne, and no, it has never been sharpened.

  Now, a few practical things. The guided tour takes about forty minutes, and it leaves every hour from the café on the ground floor. Photography is allowed everywhere except in the archive, where some of the documents are extremely fragile. If you've brought children with you, there's a drawing room upstairs, and the staff there are more than happy to keep an eye on them while you look round. The drawing room is free, by the way, and so are the pencils, as long as they don't leave the building.

  And finally, the question everyone asks: how long a line can a single pencil draw? The figure you usually hear is about fifty-six kilometres. I've never tested it myself, and I'm not sure anyone really has. But it's a lovely thought, isn't it? That one pencil holds enough line to take you from here all the way to the coast.
items:
  - q: "Graphite was first discovered beneath a ___ that had come down in a storm."
    answers: ["tree"]
    explain: "*A storm is said to have brought down a **tree**, and local shepherds found a strange black substance…* — первое упоминание, поэтому *a tree*."
  - q: "The shepherds used it to mark their ___ ."
    answers: ["sheep"]
    explain: "*They used it to mark their **sheep**.* *sheep* — одинаковая форма в единственном и множественном числе."
  - q: "Because graphite was so valuable, the mine was protected by ___ ."
    answers: ["armed men"]
    explain: "*the mine was guarded by **armed men*** — нулевой артикль с множественным числом: какие-то вооружённые люди."
  - q: "At first, graphite was wrapped in string or ___ ."
    answers: ["sheepskin", "sheep skin", "sheep-skin"]
    explain: "*simply wrapped in string or **sheepskin*** — материал, неисчисляемое, без артикля."
  - q: "The best pencils are still made with ___ wood."
    answers: ["cedar"]
    explain: "*the wood that was used, and still is in the best pencils, is **cedar*** — *the wood* конкретизирован придаточным."
  - q: "The word \"lead\" for the inside of a pencil comes from an old ___ ."
    answers: ["mistake"]
    explain: "*The word comes from an old **mistake**. People thought graphite was a kind of lead.* В карандаше свинца никогда не было."
  - q: "Conté mixed powdered graphite with ___ ."
    answers: ["clay"]
    explain: "*mixing powdered graphite with **clay**. The more clay you add, the harder the pencil.*"
  - q: "The giant coloured pencil weighs almost ___ ."
    answers: ["half a tonne", "half a ton", "half a metric ton", "0.5 tonnes"]
    explain: "*It's nearly eight metres long and weighs almost **half a tonne*** — *half a* + существительное, не *a half tonne*."
  - q: "The guided tour starts every hour from the ___ ."
    answers: ["café", "cafe", "the café", "the cafe"]
    explain: "*it leaves every hour from the **café** on the ground floor* — *the*: в музее одно конкретное кафе."
  - q: "Visitors may take photographs anywhere except the ___ ."
    answers: ["archive", "the archive"]
    explain: "*Photography is allowed everywhere except in the **archive**, where some of the documents are extremely fragile.*"
