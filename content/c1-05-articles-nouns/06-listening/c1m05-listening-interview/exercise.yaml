transcript: |
  **Presenter:** My guest today is Rachel Lowe, who left a successful restaurant career to run the kitchen at a large hospital in the north of England. Rachel, hospital food has a terrible reputation. Was that part of the attraction?

  **Rachel:** Honestly, yes. I'd spent fifteen years cooking for people who could afford a ninety-pound tasting menu, and I'd started to feel that the food was the least important thing in the room. People came for the experience, the view, the wine list. Then my mother was in hospital for a few weeks, and I watched her push away tray after tray. She wasn't fussy. The food was just joyless. And I thought, that's a problem a chef could actually solve.

  **Presenter:** What did you find when you arrived?

  **Rachel:** A team that was far better than its reputation. People assume hospital cooks don't care. The staff here care enormously. What they didn't have was time, or a budget, or anyone asking for their opinion. The kitchen had been run for years on the assumption that a meal was something to be delivered, like a parcel. Nobody had asked whether it was actually eaten.

  **Presenter:** So what changed first?

  **Rachel:** We started weighing what came back. That was the turning point. On some wards almost half the food was going in the bin. Once you've seen the figures, you can't ignore them. It was costing the hospital a fortune, and the patients weren't getting the nutrition they needed. You can't recover properly from an operation on a diet of tea and biscuits.

  **Presenter:** Is it really about money, then, rather than taste?

  **Rachel:** It's both, and I don't think you can separate them. Waste is money. But the bigger shift was in how we thought about the people we were feeding. An elderly patient who's lost her appetite doesn't need a large plate. She needs a small one, with something on it she recognises and actually wants. So we introduced smaller portions, more choice, and a soup that's available all day. The soup alone cut waste on the older wards by about a third.

  **Presenter:** You've talked before about dignity. What do you mean by that?

  **Rachel:** Eating is one of the few things in hospital that you still get to decide for yourself. You don't choose your bed, or your doctor, or the person in the next bed. So the menu matters far more than people think. If someone who grew up on spicy food has been eating plain mashed potato for three weeks, that's not a medical decision. That's just a failure of imagination.

  **Presenter:** What's been the hardest part?

  **Rachel:** Persuading people that a hospital kitchen can be a place of ambition. The government guidelines are a minimum, not a target. Some managers still see us as a cost to be cut, and I understand the pressure they're under, I really do. But a cheap meal that nobody eats isn't cheap.

  **Presenter:** Would you ever go back to restaurants?

  **Rachel:** I get asked that a lot, usually in a slightly pitying tone. No, I don't think so. I miss the adrenaline sometimes. But last month a man who'd been on the ward for six weeks asked if he could have my recipe for the fish pie. Nobody ever asked me for a recipe at the restaurant. They just took photos.

  **Presenter:** Rachel Lowe, thank you.
