title: "Part 3: A chef in a hospital kitchen"
type: listening
intro: "Послушай интервью с шеф-поваром Рейчел Лоу, которая ушла из ресторана на больничную кухню, и выбери лучший ответ. Вопросы идут по порядку записи."
