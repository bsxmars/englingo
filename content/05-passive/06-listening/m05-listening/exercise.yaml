title: "Part 2: Castlebridge Mill"
type: listening
intro: "Послушай экскурсовода и впиши в каждый пропуск одно–три слова, которые прозвучали в записи."
hints:
  - "Слово для пропуска звучит дословно; предложения задания — перефразированы, часто через актив вместо пассива."
  - "Годы и числа можно писать цифрами или словами."
