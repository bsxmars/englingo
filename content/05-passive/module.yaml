title: "5. Пассивный залог"
summary: "Уверенно строишь пассив в любом времени, говоришь «мне сделали стрижку» через have something done и пишешь отчёты и новости в безличном стиле: it is said that…, he is believed to…"
topics:
  - "Пассив во всех временах и с модальными глаголами"
  - "Глаголы с двумя дополнениями, пассив с инфинитивом и герундием, get-passive"
  - "Пассив с дополнением и инфинитивом: was elected chairman, were made to wait, was seen leaving; «дверь открылась» без пассива"
  - "have / get something done, have someone do"
  - "it is said that… / he is said to…"
