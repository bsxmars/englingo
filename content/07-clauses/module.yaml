title: "7. Придаточные предложения"
summary: "Связываешь мысли в длинные естественные предложения: who / which / that / whose, запятые в non-defining, сокращённые причастные обороты без «висячих» причастий."
topics:
  - "Defining relative clauses: who / which / that / whose / where / when, what = «то, что», It was … who"
  - "Когда относительное местоимение можно опустить, предлог в конце"
  - "Предлоги в relative clauses, whom, where / when / why, the way, whose для вещей"
  - "Non-defining relative clauses, which про всё предложение, some of whom"
  - "Participle clauses: the man sitting…, Having finished…, висячее причастие, the first to do"
