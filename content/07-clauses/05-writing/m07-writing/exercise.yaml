title: "Эссе: большая компания или стартап?"
type: writing
intro: "Напиши эссе в формате B2 First Writing Part 1. Используй обе подсказки и добавь свою идею."
prompt: |
  In your English class you have been talking about work and careers. Now your teacher has asked you to write an essay.

  **Is it better to work for a big company or a start-up?**

  Notes — write about:

  1. salary and job security
  2. learning opportunities
  3. ……… (your own idea)

  Write your essay in **140–190 words**.
words: [140, 190]
target_grammar:
  - "Defining relative clauses: who / which / that / whose"
  - "Non-defining relative clauses, which про всё предложение, many of whom / some of which"
  - "Participle clauses: people working…, Having + V3…, без висячих причастий"
checklist:
  - "Четыре абзаца: введение, две стороны, своя идея и вывод."
  - "Раскрыты обе подсказки и добавлена третья идея."
  - "Есть минимум две non-defining relative clauses, одна из них — which про всё предложение или some of whom / many of which."
  - "Есть минимум два participle clauses, и у каждого подлежащее после запятой — тот, кто действует."
  - "Связки: On the one hand / On the other hand / Moreover / However / In my opinion."
  - "Нейтральный стиль: без gonna, stuff, сокращений вроде don't."
  - "Объём 140–190 слов."
model_answer: |
  These days, many young professionals have to choose between a large company and a small start-up. Both options have clear advantages, which makes the decision far from easy.

  On the one hand, big companies offer stability. Employees working for a large corporation receive a reliable salary and are less likely to lose their jobs. Moreover, people who are just starting their careers can learn a great deal from experienced colleagues, many of whom have spent decades in the industry.

  On the other hand, a start-up gives you responsibility from the first day. Having joined a small team, you are often expected to do several jobs at once, which can be exhausting but teaches you far more than a narrow role would. In addition, employees whose ideas are good can see them put into practice within weeks rather than years.

  In my opinion, the right choice depends on the stage of your career. Graduates looking for a solid foundation should start in a big company. However, for someone who has already gained some experience and is willing to take risks, a start-up can be the most rewarding place to work.
