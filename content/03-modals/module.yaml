title: "3. Модальные глаголы"
summary: "Различаешь «нельзя» и «не обязательно», говоришь «смог» без ошибки с could, делаешь выводы о настоящем и прошлом (must be, can't have done) и сожалеешь правильно: should have done."
topics:
  - "must / have to / need to / should / had better"
  - "mustn't ≠ don't have to"
  - "can / could / be able to / managed to; may / be allowed to"
  - "Выводы: must / might / can't (have done)"
  - "should have / needn't have / didn't need to"
  - "Модальные о прошлом: should / could / might / would have, was supposed to, пассив и Continuous"
  - "be supposed to; have to после might, в Present Perfect"
  - "Просьбы, предложения, приглашения: Could you, Would you mind, Shall I, Why don't we"
sources:
  - {title: "Oxford Practice Grammar — разделы о модальных глаголах", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: Modal Verbs of Obligation", url: "https://www.perfect-english-grammar.com/modal-verbs-of-obligation-exercise-1.html"}
  - {title: "Perfect English Grammar: Modal Verbs of Probability", url: "https://www.perfect-english-grammar.com/modal-verbs-of-probability-exercise-1.html"}
