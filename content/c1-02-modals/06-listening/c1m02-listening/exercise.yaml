title: "Part 3: Mountain rescue"
type: listening
intro: "Послушай радиоинтервью с Оуэном Хейлом, руководителем добровольной горноспасательной команды, и выбери лучший ответ. Вопросы идут по порядку записи."
hints:
  - "Вопросы — об отношении, мнении и цели. Слушай оговорки: although, less than you might think."
  - "must have / needn't have / could have — выводы и оценки прошлого, а не факты."
