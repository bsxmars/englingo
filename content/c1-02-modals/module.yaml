title: "C1 · 2. Модальные глаголы"
level: c1
book: book-advanced
summary: "Свободно строишь сложные модальные формы (must have been doing, should have been told), различаешь оттенки will / would / be going to, may / might / could, needn't have / didn't need to и пишешь с их помощью аккуратные предположения, оговорки и рекомендации в формальном тексте."
topics:
  - "Модальные и phrasal modals; complex modals: perfect, continuous, passive"
  - "Prediction и willingness: will, would, shall, be going to"
  - "Ability, permission, possibility: can, could, be able to, may, might, be allowed to"
  - "Necessity и deduction: must, have to, have got to, need, needn't have, can't have"
  - "Obligation и advice: should, ought to, be supposed to, had better"
  - "Modal perfects: упрёк, сожаление, упущенные возможности и выводы о прошлом; was to have done, be supposed to have done"
sources:
  - {title: "Oxford Practice Grammar Advanced — модальные глаголы", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: modal verbs of probability", url: "https://www.perfect-english-grammar.com/modal-verbs-of-probability-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
