- id: m09-article-algorithm
  lesson: 09-nouns-articles/01-articles
  q: "Как выбрать артикль за три шага?"
  a: "Слушатель знает, какой именно → **the**. Нет, и это одно исчисляемое → **a/an**. Множественное или неисчисляемое в общем смысле → **без артикля**."
- id: m09-profession
  lesson: 09-nouns-articles/01-articles
  q: "Переведи: «Я программист, а моя сестра — архитектор»."
  a: "*I'm **a** programmer, and my sister is **an** architect.* Профессия всегда с a/an."
- id: m09-a-an-sound
  lesson: 09-nouns-articles/01-articles
  q: "**a** или **an**: ___ hour, ___ university, ___ MBA, ___ European city?"
  a: "**an** hour, **a** university, **an** MBA, **a** European city — решает первый **звук**, а не буква."
- id: m09-life-is-hard
  lesson: 09-nouns-articles/01-articles
  q: "Найди ошибку: *The life is hard, but the music helps.*"
  a: "*Life is hard, but music helps.* — общие утверждения без артикля."
- id: m09-dogs-general
  lesson: 09-nouns-articles/01-articles
  q: "В чём разница: *Dogs are loyal* / *The dogs next door are loud*?"
  a: "Без артикля — собаки вообще. **the** — конкретные собаки (соседские)."
- id: m09-go-to-bed
  lesson: 09-nouns-articles/01-articles
  q: "go to bed, go to school, be in hospital — почему без артикля?"
  a: "Речь о **назначении** места: спать, учиться, лечиться. Если о здании — *the*: *go to **the** school to meet the teacher*."
- id: m09-geography
  lesson: 09-nouns-articles/01-articles
  q: "Артикль или нет: ___ Spain, ___ Netherlands, ___ Volga, ___ Lake Baikal, ___ Alps?"
  a: "Spain, **the** Netherlands, **the** Volga, Lake Baikal, **the** Alps."
- id: m09-superlative-the
  lesson: 09-nouns-articles/01-articles
  q: "Найди ошибку: *We went to same school, and it was best school in town.*"
  a: "*We went to **the** same school, and it was **the** best school in town.*"
- id: m09-uncountable-list
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Назови 6 существительных, неисчисляемых в английском, но «считаемых» по-русски."
  a: "*advice, information, news, furniture, equipment, research* (а также *luggage, progress, work, homework, knowledge*)."
- id: m09-piece-of-advice
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Переведи: «Можно дать тебе один совет?»"
  a: "*Can I give you **a piece of advice**?* (или *some advice*, *a tip*). Не ~~an advice~~."
- id: m09-news-is
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Найди ошибку: *The news are really good!*"
  a: "*The news **is** really good!* — **news** неисчисляемое, глагол в единственном числе."
- id: m09-work-job
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "**work** или **job**: I've got a new ___. / I've got a lot of ___."
  a: "*a new **job*** (должность, исчисляемое); *a lot of **work*** (труд, неисчисляемое)."
- id: m09-much-positive
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Почему *We have much time* звучит неестественно?"
  a: "**much** — в вопросах и отрицаниях. В утверждении: *We have **a lot of** time*. Исключения: *too much, so much*."
- id: m09-few-vs-a-few
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "В чём разница: *I have a few friends* / *I have few friends*?"
  a: "**a few** — несколько, и это хорошо. **few** — мало, почти нет (негатив)."
- id: m09-little-vs-a-little
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Переведи: «Я немного говорю по-испански»."
  a: "*I speak **a little** Spanish.* — *little Spanish* значило бы «почти не говорю»."
- id: m09-progress
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Найди ошибку: *She has made a big progress.*"
  a: "*She has made **a lot of** / **great** progress.* — **progress** неисчисляемое, без *a*."
- id: m09-double-negative
  lesson: 09-nouns-articles/03-quantifiers
  q: "Найди ошибку: *I didn't say nothing to nobody.*"
  a: "*I didn't say **anything** to **anybody**.* (или *I said nothing to anybody*) — в английском одно отрицание."
- id: m09-some-offers
  lesson: 09-nouns-articles/03-quantifiers
  q: "Почему *Would you like **some** tea?*, а не *any*?"
  a: "В предложениях и просьбах ждём ответа «да» → **some**, даже в вопросе."
- id: m09-neither-none
  lesson: 09-nouns-articles/03-quantifiers
  q: "**neither** или **none**: ___ of my parents speaks English."
  a: "**Neither** — родителей двое. **none** — для трёх и больше."
- id: m09-every-singular
  lesson: 09-nouns-articles/03-quantifiers
  q: "Найди ошибку: *Every students have to bring a laptop.*"
  a: "*Every **student has** to bring a laptop.* — после *every* единственное число."
- id: m09-every-one-of
  lesson: 09-nouns-articles/03-quantifiers
  q: "Как правильно: *Every of them* или *Every one of them*?"
  a: "***Every one of** them* или ***Each of** them*. ~~Every of~~ не бывает."
- id: m09-each-two
  lesson: 09-nouns-articles/03-quantifiers
  q: "Почему *a ring on **each** hand*, а не *every hand*?"
  a: "Рук две. **each** — для двух и больше, **every** — для трёх и больше."
- id: m09-no-shortage
  lesson: 09-nouns-articles/04-reading
  q: "Переведи: «Советов в интернете предостаточно»."
  a: "*There's **no shortage of** advice online.* — *advice* без *-s*."
- id: m09-review-recommend
  lesson: 09-nouns-articles/05-writing
  q: "Как в отзыве порекомендовать место и мягко покритиковать?"
  a: "*I'd highly recommend it to anyone who… / It's well worth a visit.* — *The only downside is…*"
- id: m09-play-the-piano
  lesson: 09-nouns-articles/01-articles
  q: "Артикль или нет: play ___ guitar / play ___ football?"
  a: "*play **the** guitar* — инструменты с *the*; *play football* — спорт без артикля."
- id: m09-police-officer
  lesson: 09-nouns-articles/01-articles
  q: "Найди ошибку: *A police came to our house.*"
  a: "*A **police officer** came…* или *The police came…* — *police* = вся служба, глагол во множественном."
- id: m09-quick-lunch
  lesson: 09-nouns-articles/01-articles
  q: "Почему *have lunch*, но *We had **a** quick lunch*?"
  a: "Приёмы пищи и фразы времени без артикля, но с прилагательным появляется **a**."
- id: m09-loaf-tube-bar
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Как сказать: буханка хлеба, тюбик пасты, плитка шоколада, банка варенья?"
  a: "*a **loaf** of bread, a **tube** of toothpaste, a **bar** of chocolate, a **jar** of jam*."
- id: m09-fun-luck
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Найди ошибку: *We had a great fun. — A good luck with your exam!*"
  a: "*We had **great fun**. Good luck!* — *fun* и *luck* неисчисляемые."
- id: m09-a-lot-no-of
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Найди ошибку: *Do you read much? — Yes, a lot of.*"
  a: "*Yes, **a lot**.* — без существительного *of* не нужен."
- id: m09-one-of-is
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "Найди ошибку: *One of my friends live in Berlin.*"
  a: "*One of my friends **lives**…* — подлежащее *one*, глагол в единственном."
- id: m09-number-of
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "**a number of** или **the number of**: какой глагол после каждого?"
  a: "***A** number of* people **are** (= несколько, мн.); ***the** number of* people **is** (= количество, ед.)."
- id: m09-news-police-jeans
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "is или are: The news ___ / Physics ___ / The police ___ / My jeans ___?"
  a: "news **is**, physics **is**, the police **are**, my jeans **are**."
- id: m09-ten-minute-walk
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "Переведи: «в десяти минутах ходьбы», «пятилетний мальчик», «обувной магазин»."
  a: "*a **ten-minute** walk, a **five-year-old** boy, a **shoe** shop* — без *-s* в первой части."
- id: m09-what-a-weather
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "Найди ошибку: *What a nice weather! It's a such lovely day.*"
  a: "*What **nice weather**! It's **such a** lovely day.* — *weather* неисчисляемое; *such* перед *a*."
- id: m09-most-people
  lesson: 09-nouns-articles/03-quantifiers
  q: "«Большинство людей» и «большинство из этих людей» — как сказать?"
  a: "***Most people*** (вообще); ***Most of the / these people*** (конкретные). Не ~~most of people~~."
- id: m09-friend-of-mine
  lesson: 09-nouns-articles/03-quantifiers
  q: "Переведи: «Это мой друг (один из моих друзей), у него своя компания»."
  a: "*He's **a friend of mine**. He has **his own** company.* — не ~~a friend of me~~, ~~an own~~."
- id: m09-shake-head
  lesson: 09-nouns-articles/03-quantifiers
  q: "Найди ошибку: *He raised the hand and asked a question.*"
  a: "*He raised **his** hand…* — с частями тела притяжательное слово."
- id: m09-generic-plural
  lesson: 09-nouns-articles/01a-generic-articles
  q: "«Кошки — независимые животные» (вообще): *Cats* или *The cats*?"
  a: "**Cats** are independent animals. *The cats* — конкретные кошки (например, твои)."
- id: m09-education-zero
  lesson: 09-nouns-articles/01a-generic-articles
  q: "Найди ошибку: *The technology changes our lives.*"
  a: "**Technology** changes our lives. Абстрактные понятия в общем смысле — без артикля."
- id: m09-modern-art
  lesson: 09-nouns-articles/01a-generic-articles
  q: "Нужен ли артикль: *I don't understand ___ modern art.*"
  a: "Нет: **modern art**. Прилагательное не делает понятие конкретным."
- id: m09-history-of
  lesson: 09-nouns-articles/01a-generic-articles
  q: "*I study history* — а как «История этого города богатая»?"
  a: "**The history of** this city is rich. *of* + конкретное → **the**."
- id: m09-the-rich
  lesson: 09-nouns-articles/01a-generic-articles
  q: "Как сказать «бедные» (как группа) и «один бедный человек»?"
  a: "**the poor** (глагол во мн. ч.: *the poor are…*); один — *a poor man / woman*, не ~~a poor~~."
- id: m09-the-french
  lesson: 09-nouns-articles/01a-generic-articles
  q: "«Французы любят сыр»: *French love…* или *The French love…*?"
  a: "**The French** love cheese. Национальности на *-sh, -ch, -ese* — с **the**. Но *Russians* / *the Russians*."
- id: m09-a-dolphin
  lesson: 09-nouns-articles/01a-generic-articles
  q: "Почему можно *A dolphin is a mammal*, но нельзя ~~A tiger is endangered~~?"
  a: "*a* в общем смысле = «любой представитель». Млекопитающее — каждый дельфин; под угрозой — вид целиком: **The tiger is endangered**."
- id: m09-invented-the
  lesson: 09-nouns-articles/01a-generic-articles
  q: "Переведи: «Кто изобрёл колесо?»"
  a: "Who invented **the wheel**? Изобретение как тип предмета — **the** + ед. ч."
- id: m09-platform-5
  lesson: 09-nouns-articles/01-articles
  q: "Найди ошибку: *The train leaves from the platform 3. Our seats are in the carriage 7.*"
  a: "Номер **после** существительного → без артикля: *from **platform 3**, in **carriage 7***. Но *on **the** third platform*."
- id: m09-go-to-the-bank
  lesson: 09-nouns-articles/01-articles
  q: "Переведи: «Мне нужно сходить в банк, а потом к стоматологу»."
  a: "I need to go to **the bank** and then to **the dentist** (или *the dentist's*). Привычные места — с **the**."
- id: m09-next-day
  lesson: 09-nouns-articles/01-articles
  q: "*next week* или *the next week*: «Мы приехали в понедельник и уехали на следующий день»."
  a: "We arrived on Monday and left **the next day**. От другого момента — **the next**; от сегодня — *next week* без артикля."
- id: m09-people-who
  lesson: 09-nouns-articles/01a-generic-articles
  q: "Почему *I like working with **people who** say what they think* — без *the*?"
  a: "Придаточное описывает **тип** людей («любые такие»), мысль общая. Конкретная группа — ***the people** I work with*."
- id: m09-chinese-person
  lesson: 09-nouns-articles/01a-generic-articles
  q: "Как лучше сказать «Он китаец», «Она швейцарка»?"
  a: "*He's **Chinese**. She's **Swiss**.* — прилагательным. ~~He's a Chinese~~ звучит устаревше; можно *a Chinese **person***."
- id: m09-dr-smith
  lesson: 09-nouns-articles/01b-names
  q: "Артикль или нет: ___ Dr Patel / ___ doctor / ___ Smiths (вся семья) / ___ President Lincoln?"
  a: "*Dr Patel* — без; ***the** doctor* — титул без имени; ***the** Smiths* — семья; *President Lincoln* — без."
- id: m09-hilton-oxford-street
  lesson: 09-nouns-articles/01b-names
  q: "Найди ошибку: *We stayed at Hilton on the Oxford Street, near British Museum.*"
  a: "*at **the** Hilton* (отели — с the), *on **Oxford Street*** (улицы — без), *near **the** British Museum* (музеи — с the)."
- id: m09-university-of
  lesson: 09-nouns-articles/01b-names
  q: "*Oxford University* или *the Oxford University*? А с *of*?"
  a: "***Oxford University*** — первое слово имя, без артикля. С *of* — ***the** University of Oxford*."
- id: m09-north-northern
  lesson: 09-nouns-articles/01b-names
  q: "Переведи двумя способами: «на севере Италии»."
  a: "*in **the north** of Italy* или *in **northern** Italy* (без артикля). ~~in the northern Italy~~ — ошибка."
- id: m09-plenty-of
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Найди ошибку: *Relax, we have plenty time. There's plenty things to see here.*"
  a: "*plenty **of** time*; *There are plenty **of** things to see* или *There's plenty **to** see*."
- id: m09-scenery-view
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "*What a beautiful scenery!* — что не так?"
  a: "**scenery** неисчисляемое: ***What beautiful scenery!*** С исчисляемым *view* — ***What a beautiful view!***"
- id: m09-permission-bread
  lesson: 09-nouns-articles/02-countable-uncountable
  q: "Найди ошибки: *I asked for a permission to leave early and bought a bread on the way home.*"
  a: "*asked for **permission***; *bought **some bread*** / ***a loaf of** bread*. Оба слова неисчисляемые."
- id: m09-race-horse
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "В чём разница: *a race horse* / *a horse race*?"
  a: "Главное слово — **последнее**: *a race horse* — скаковая лошадь, *a horse race* — скачки."
- id: m09-anna-and-marks
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "*Anna and Mark's cars* или *Anna's and Mark's cars* — если у каждого своя машина?"
  a: "***Anna's and Mark's** cars* — 's на каждом. Общая вещь — 's на последнем: *Anna and Mark's flat*."
- id: m09-persons-people
  lesson: 09-nouns-articles/02a-noun-agreement
  q: "Найди ошибку: *About fifty persons came to the presentation.*"
  a: "*About fifty **people** came.* *persons* — только в официальных табличках (*Max. 8 persons*)."
- id: m09-without-any
  lesson: 09-nouns-articles/03-quantifiers
  q: "some или any: *She left without ___ money. Hardly ___ came. Let me know if you need ___.*"
  a: "*without **any** money*, *hardly **anyone** came*, *if you need **anything***: отрицательный смысл и *if* → any."
- id: m09-no-at-start
  lesson: 09-nouns-articles/03-quantifiers
  q: "Найди ошибку: *Anybody didn't come to the meeting.*"
  a: "***Nobody** came to the meeting.* В начале предложения отрицание — только *no / nobody / nothing*."
- id: m09-all-everything
  lesson: 09-nouns-articles/03-quantifiers
  q: "Найди ошибки: *All enjoyed the trip. He spent the whole money on souvenirs.*"
  a: "***Everybody** enjoyed the trip* (all в одиночку не ставят); *spent **all the** money* (whole — только с исчисляемым)."
- id: m09-every-ten-minutes
  lesson: 09-nouns-articles/03-quantifiers
  q: "Переведи: «Автобус ходит каждые десять минут, а Олимпиада проходит раз в четыре года»."
  a: "The bus runs **every ten minutes**, and the Olympics take place **every four years**. every + число + мн. ч."
