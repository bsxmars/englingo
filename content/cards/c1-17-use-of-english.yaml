- id: c1m17-make-do-progress
  lesson: c1-17-use-of-english/01-collocations
  q: "**make** или **do**: ___ progress, ___ damage, ___ research, ___ an effort?"
  a: "*make progress, do damage, do research, make an effort*."
- id: c1m17-take-steps
  lesson: c1-17-use-of-english/01-collocations
  q: "Переведи: «принять меры, чтобы решить проблему»."
  a: "*take steps / measures / action to solve the problem*. Не ~~do steps~~."
- id: c1m17-raise-rise
  lesson: c1-17-use-of-english/01-collocations
  q: "Найди ошибку: *She rose an important question at the meeting.*"
  a: "*She **raised** an important question.* *rise* — непереходный, *raise* — «поднять что-то»."
- id: c1m17-raise-awareness
  lesson: c1-17-use-of-english/01-collocations
  q: "Переведи: «привлечь внимание общества к проблеме» (одной коллокацией с *raise*)."
  a: "*raise (public) awareness of the problem*."
- id: c1m17-draw-reach
  lesson: c1-17-use-of-english/01-collocations
  q: "**draw** или **reach**: ___ a conclusion from the data / ___ an agreement after talks?"
  a: "*draw a conclusion* (из фактов); *reach an agreement / a compromise / a verdict* (в результате обсуждения)."
- id: c1m17-meet-deadline
  lesson: c1-17-use-of-english/01-collocations
  q: "Переведи: «уложиться в срок»."
  a: "*meet the deadline*. Не ~~keep a deadline~~."
- id: c1m17-pose-threat
  lesson: c1-17-use-of-english/01-collocations
  q: "Переведи: «представлять серьёзную угрозу»."
  a: "*pose a serious threat (to)*."
- id: c1m17-pay-tribute
  lesson: c1-17-use-of-english/01-collocations
  q: "Какой глагол: ___ attention, ___ tribute, ___ a compliment?"
  a: "**pay**: *pay attention, pay tribute to, pay a compliment*."
- id: c1m17-take-toll
  lesson: c1-17-use-of-english/01-collocations
  q: "Переведи: «Стресс серьёзно сказался на её здоровье»."
  a: "*Stress took a heavy toll on her health.*"
- id: c1m17-highly-unlikely
  lesson: c1-17-use-of-english/01-collocations
  q: "Какое наречие: ___ unlikely, ___ recommended, ___ successful?"
  a: "**highly**."
- id: c1m17-bitterly
  lesson: c1-17-use-of-english/01-collocations
  q: "Какое наречие: ___ disappointed, ___ opposed, ___ cold?"
  a: "**bitterly**."
- id: c1m17-deeply-painfully
  lesson: c1-17-use-of-english/01-collocations
  q: "Дополни: ___ rooted, ___ divided; ___ aware, ___ shy."
  a: "**deeply** rooted / divided; **painfully** aware / shy (также *acutely aware*)."
- id: c1m17-heavy-rain
  lesson: c1-17-use-of-english/01-collocations
  q: "Переведи: «сильный дождь», «сильный ветер», «острая нехватка»."
  a: "*heavy rain, a strong wind, an acute shortage*."
- id: c1m17-utterly-exhausted
  lesson: c1-17-use-of-english/01-collocations
  q: "Найди ошибку: *After the marathon I was very exhausted.*"
  a: "*exhausted* — экстремальное прилагательное: ***utterly / absolutely / completely** exhausted*."
- id: c1m17-dependent-on
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Предлоги: dependent ___, independent ___?"
  a: "*dependent **on***, но *independent **of***."
- id: c1m17-in-favour-of
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Переведи: «Большинство выступает за реформу»."
  a: "*The majority are **in favour of** the reform.*"
- id: c1m17-verge-of
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Переведи: «Компания на грани банкротства»."
  a: "*The company is **on the verge / brink of** bankruptcy.*"
- id: c1m17-at-odds-with
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Что значит **at odds with**? Пример."
  a: "«В противоречии, в конфликте с»: *His actions are at odds with his words.*"
- id: c1m17-with-regard-to
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Найди ошибку: *In regards to your letter, …*"
  a: "***With regard to** / In regard to your letter, …* — без *-s*."
- id: c1m17-regardless-of
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Переведи: «независимо от возраста»."
  a: "*regardless of age* (или *irrespective of age*). Не ~~regardless to~~."
- id: c1m17-result-in-from
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "**result in** или **result from**: The flood ___ heavy rain. Heavy rain ___ a flood."
  a: "*The flood **resulted from** heavy rain* (следствие ← причина). *Heavy rain **resulted in** a flood* (причина → следствие)."
- id: c1m17-rise-in
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "**a rise in** или **a rise of**: ___ prices, ___ 5%?"
  a: "*a rise **in** prices* (чего), *a rise **of** 5%* (на сколько)."
- id: c1m17-accuse-blame
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Предлоги: accuse sb ___ lying; blame sb ___ the delay."
  a: "*accuse sb **of**, blame sb **for***."
- id: c1m17-susceptible-detrimental
  lesson: c1-17-use-of-english/02-dependent-prepositions
  q: "Какой предлог объединяет: susceptible, prone, detrimental, conducive?"
  a: "**to**: *susceptible to, prone to, detrimental to, conducive to*."
- id: c1m17-let-alone
  lesson: c1-17-use-of-english/03-open-cloze
  q: "Переведи: «Он не умеет варить яйца, не говоря уже о том, чтобы готовить ужин»."
  a: "*He can't boil an egg, **let alone** cook dinner.*"
- id: c1m17-during-which
  lesson: c1-17-use-of-english/03-open-cloze
  q: "Одно слово: *We waited two hours, during ___ time we explored the town.*"
  a: "**which**: *during which time* — «за это время»."
- id: c1m17-despite-having
  lesson: c1-17-use-of-english/03-open-cloze
  q: "Одно слово: *___ having trained for months, he didn't finish the race.*"
  a: "**Despite** — после него *-ing*. *Although* потребовал бы подлежащего: *Although he had trained…*"
- id: c1m17-negative-prefixes
  lesson: c1-17-use-of-english/03a-word-formation-c1
  q: "Отрицательная приставка: ___partial, ___relevant, ___logical, ___conclusive?"
  a: "*impartial, irrelevant, illogical, inconclusive*."
- id: c1m17-invaluable
  lesson: c1-17-use-of-english/03a-word-formation-c1
  q: "Что значит **invaluable**? А **disinterested**?"
  a: "*invaluable* — «бесценный» (не «ничего не стоящий»). *disinterested* — «беспристрастный» (а «равнодушный» — *uninterested*)."
- id: c1m17-spelling-roots
  lesson: c1-17-use-of-english/03a-word-formation-c1
  q: "Существительные от: maintain, pronounce, explain?"
  a: "*maintenance, pronunciation, explanation*."
- id: c1m17-part4-count
  lesson: c1-17-use-of-english/03b-transformations
  q: "Part 4 C1: сколько слов вписать и как считаются сокращения?"
  a: "От **3 до 6** слов, включая ключевое. Сокращения считаются полностью: *didn't* = 2 слова."
- id: c1m17-worth
  lesson: c1-17-use-of-english/03b-transformations
  q: "Перефразируй с WORTH: *There's no point in arguing.*"
  a: "*It **isn't worth arguing**.*"
- id: c1m17-down-to
  lesson: c1-17-use-of-english/03b-transformations
  q: "Перефразируй с DOWN: *Her success was due to hard work, not luck.*"
  a: "*Her success **was down to** hard work, not luck.*"
- id: c1m17-proposal-subjunctive
  lesson: c1-17-use-of-english/05-writing
  q: "Найди ошибку: *It is recommended that the company introduces weekly sessions.*"
  a: "*…that the company **introduce** (или **should introduce**)…* — после *recommend that* сослагательное."
- id: c1m17-prevent-avoid
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "**prevent** или **avoid**: *The fence should ___ children from falling.*"
  a: "**prevent / stop sb from -ing**. *avoid* — «избегать самому», без дополнения-человека: *avoid falling*."
- id: c1m17-suggest-advise
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "Найди ошибку: *She suggested me to apply for the job.*"
  a: "*She **advised me to** apply* или *She **suggested (that) I apply** / suggested applying*. ~~suggest sb to~~ не бывает."
- id: c1m17-succeed-manage
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "Какие конструкции после **succeed**, **manage**, **achieve**?"
  a: "*succeed **in** -ing*, *manage **to** do*, *achieve + существительное* (*achieve a goal*)."
- id: c1m17-notorious
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "**famous**, **renowned** или **notorious**: *The road is ___ for accidents.*"
  a: "**notorious** — печально известный. *famous / renowned* — положительная слава."
- id: c1m17-at-stake
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "Переведи: «На кону тысячи рабочих мест»."
  a: "*Thousands of jobs are **at stake**.*"
- id: c1m17-on-the-whole
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "Чем **on the whole** отличается от **as a whole**?"
  a: "*on the whole* — «в общем и целом» (обобщение); *as a whole* — «целиком, как единое» (в противовес частям): *the industry as a whole*."
- id: c1m17-short-notice
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "Найди ошибку: *The meeting was cancelled at a short notice.*"
  a: "**at short notice** — без артикля."
- id: c1m17-earn-gain
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "**earn** или **gain**: ___ a living, ___ experience, ___ a reputation."
  a: "**earn** a living, **gain** experience, **earn** a reputation (заслужить трудом)."
- id: c1m17-slim-chance
  lesson: c1-17-use-of-english/03c-lexical-cloze
  q: "Какое прилагательное: *a ___ chance*, *a ___ escape*, *the ___ majority*?"
  a: "*a **slim** chance*, *a **narrow** escape*, *the **vast** majority*."
