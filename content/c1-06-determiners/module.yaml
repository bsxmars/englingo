title: "C1 · 6. Определители и квантификаторы"
level: c1
book: book-advanced
summary: "Точно и по-письменному говоришь о количестве: some twenty years ago, much of Europe, many a writer, the whole of the region, two-thirds of the budget is. Различаешь fewer и less, every и each, a few и few и не ошибаешься в согласовании с дробями и процентами."
topics:
  - "Определители и местоимения: my / mine, every / every one, no / none; of-фразы (two of the, most of Europe)"
  - "some и any в тонких значениях: «примерно», «какой-то», «любой»; no вместо not any"
  - "all / both / half / whole; each / every / either / neither и согласование"
  - "most / the most / mostly, many more / much more, enough и sufficient, several hundred, numerous и plenty of"
  - "many и much в формальном стиле, many a, a great deal of; few / little, fewer / less"
  - "Умножители, дроби и проценты: twice as many, three times the size, two-thirds of… is / are"
sources:
  - {title: "Oxford Practice Grammar Advanced — Determiners and quantifiers", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: some и any", url: "https://www.perfect-english-grammar.com/some-and-any-exercise-2.html"}
  - {title: "Perfect English Grammar: a little и a few", url: "https://www.perfect-english-grammar.com/a-little-a-few-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
