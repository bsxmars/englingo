title: "Part 1: Three short extracts"
type: listening
intro: "Послушай три коротких отрывка. К каждому — два вопроса; выбери ответ, который лучше всего соответствует тому, что услышано."
hints:
  - "few — мало, почти нет; a few — несколько. Общая оценка складывается из обоих."
  - "Мнение говорящего часто идёт после but I think — до этого звучит чужая версия."
