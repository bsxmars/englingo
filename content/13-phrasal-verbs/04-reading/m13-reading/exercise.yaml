text: |
  ## From a garage to a shop: how we set up our bike business

  Three years ago, my friend Leo and I were both working in offices and fixing bikes at weekends, mostly for friends. We never planned to start a business. It just grew out of a hobby that had taken over our lives — and our garage.

  The idea came up one evening when a neighbour knocked on the door with a broken wheel. "You should charge for this," she said, handing us twenty euros. We laughed, but later that night Leo did the maths. If we fixed ten bikes a week, we could pay for a small workshop. If we fixed thirty, we could give up our office jobs. I told him he was dreaming. A month later, I handed in my notice.

  Setting up the shop was harder than we had expected. Two banks turned us down for a loan, saying a bike repair business was "too risky". In the end, we put our savings together and borrowed the rest from Leo's uncle, who made us promise to pay him back within two years. We found a tiny shop near the station, but the deal fell through at the last minute when the landlord decided to sell the building. For a few weeks, I honestly thought we would have to give up the whole idea.

  Then, to our surprise, the landlord's son got in touch. He had heard what had happened and offered us a space at the back of his café. It was dark and cramped, but the rent was low, and every customer who came in for a coffee walked past our bikes. Looking back, that "bad luck" was the best thing that could have happened to us.

  The first winter nearly finished us off. Nobody cycles much in January, and we soon ran out of money. We came up with a plan: instead of waiting for broken bikes, we would offer cheap check-ups to delivery riders, who use their bikes every day whatever the weather. It worked. Word of mouth did the rest, and by spring we had more work than we could cope with.

  Last year we took on our first employee, Maya, a student who turned up one day asking if she could watch us work. She now runs our evening repair classes, which have become surprisingly popular. People don't just want their bikes fixed; they want to understand how to look after them.

  We're not rich, and we still work long hours. We put off our holidays two summers in a row, and I've had to cut down on sleep more often than I'd like. But we've paid Leo's uncle back in full, three months early, and every morning I look forward to opening the shop.

  If you're thinking of turning a hobby into a business, my advice is simple: work out your numbers, find people you trust, and when things go wrong — and they will — don't give up too quickly. Sometimes the plan that falls through makes room for a better one.
