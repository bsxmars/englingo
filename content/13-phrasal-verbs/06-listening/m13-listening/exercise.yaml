title: "Part 4: From runner to Channel swimmer"
type: listening
intro: "Послушай радиоинтервью с Рейчел Мур, которая переплыла Ла-Манш, и выбери ответ. Вопросы идут по порядку записи."
hints:
  - "В вариантах — синонимы фразовых глаголов из записи: talked me into → persuaded."
  - "Следи, кто что сказал: врач, подруга, муж, дочь и тренер говорят разное."
