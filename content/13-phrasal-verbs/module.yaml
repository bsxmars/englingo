title: "13. Фразовые и предложные глаголы"
summary: "Различаешь предложные и фразовые глаголы, правильно ставишь местоимение (turn it off, а не turn off it), понимаешь смысл частиц up / down / out / off и уверенно используешь частотные B2-глаголы: put off, give up, run out of, look forward to, put up with."
topics:
  - "Предложные глаголы: wait for, depend on, look after; глагол + дополнение + предлог: thank sb for, accuse sb of"
  - "Фразовые глаголы: смысл частиц, порядок слов с дополнением"
  - "Частотные фразовые глаголы уровня B2"
  - "Значения частиц глубже (turn out, wear off, pay off, take over); существительные из фразовых глаголов: breakdown, setback, outcome, check-in"
  - "Частотные фразовые глаголы по частицам in / out, on / off, up / down, away / back: put sb off, take up space, get back to"
  - "Глагол + наречие + предлог: look forward to, get on with, put up with"
