transcript: |
  **Presenter:** Hello and welcome to *Second Chances*, the programme about people who've changed direction. My guest today is Kirsty Bell, who spent eleven years working for a bank in Sydney before becoming a mountain guide in New Zealand. Kirsty, what made you decide to leave?

  **Kirsty:** Well, people expect me to say I hated the job, but I didn't, really. I quite enjoyed working with numbers. What I couldn't stand was spending ten hours a day without seeing the sky. Then one winter my sister persuaded me to come on a climbing trip with her, and I remember standing on top of a mountain and thinking, I want to do this every day.

  **Presenter:** Did you resign straight away?

  **Kirsty:** Oh no, I'm far too careful for that. I kept working for another two years and saved as much as I could. My manager actually let me take unpaid leave to do the first guiding course, which was really generous of him.

  **Presenter:** What was the training like?

  **Kirsty:** Tough. The instructors made us carry thirty-kilo packs up steep slopes in the rain, and they refused to let anyone skip a session. A lot of people gave up. I nearly did too, during a navigation exercise when I got completely lost. But I tried thinking of it as a puzzle rather than a test, and somehow that helped.

  **Presenter:** Is there anything you regret?

  **Kirsty:** Not leaving, no. I do regret not learning to ski properly as a child, because now I have to work twice as hard in winter. And I miss being able to afford nice restaurants! Guides don't earn much.

  **Presenter:** What's the best part of the job?

  **Kirsty:** Watching people do something they thought they were too scared to do. Last month I took a group of retired teachers up a glacier. One of them, who'd avoided heights her whole life, stopped to look at the view and just started crying. Happy tears, I mean.

  **Presenter:** And what would you say to someone who's thinking about a change like yours?

  **Kirsty:** Don't wait to feel ready, because you never will. But do make a plan. I'd never advise anyone to quit a job without some savings.

  **Presenter:** Kirsty Bell, thank you very much.
