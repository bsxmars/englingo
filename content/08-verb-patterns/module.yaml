title: "8. Глагольные модели"
summary: "Перестаёшь гадать между -ing и to: знаешь, какие глаголы что требуют, чем stop doing отличается от stop to do и как работают make, let и allow."
topics:
  - "Глагол + -ing и глагол + to, глагол + объект + to, -ing после предлогов"
  - "Глагол + объект: want sb to do, mind sb doing, talk sb into / out of doing; где объект + to невозможен (suggest, hope, insist)"
  - "remember / forget / stop / try / regret / mean / go on: смена смысла"
  - "make / let / allow / force / help, be made to do, easy to use, too / enough"
  - "what to do, for sb to do, afraid to / afraid of, instead of doing, see it happen / happening"
sources:
  - {title: "Oxford Practice Grammar — разделы о gerund и infinitive", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: Gerunds and Infinitives (1)", url: "https://www.perfect-english-grammar.com/gerunds-and-infinitives-exercise-1.html"}
  - {title: "Cambridge English: B2 First — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/first/"}
