title: "Part 3: Speaking for others"
type: listening
intro: "Послушай радиоинтервью с синхронным переводчиком Маркусом Беллом и выбери ответ. Вопросы идут по порядку записи."
hints:
  - "Маркус часто пересказывает чужие слова: проверь, чья позиция в варианте ответа."
  - "Вопрос «Why does he tell the story…» — о цели истории, а не о её фактах."
audio: audio/tts/c1-11/interview.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-GB-SoniaNeural, en-US-AndrewNeural", license: "TTS"}
transcript: |
  **Presenter:** My guest today is Marcus Bell, who has worked as a conference interpreter for over twenty years, translating between English, French and Spanish. Marcus, a lot of people assume interpreting is just translating very fast. Is that fair?

  **Marcus:** It's a common assumption, and I can see why people make it. But no. When I started, my trainer warned me that if I tried to translate every word, I'd drown within ten minutes. What you're really doing is reporting what someone means, a fraction of a second after they've said it. You're constantly asking yourself not "What did she say?" but "What is she trying to tell them?"

  **Presenter:** Do speakers ever make that harder?

  **Marcus:** Constantly. The worst are people who read from a script at top speed. Once, a minister apologised to the audience for running late and announced that he would skip the introduction, and then he read the rest twice as fast to make up for it. Afterwards, one of the delegates came up and congratulated us on keeping up. We hadn't, entirely, but it was kind of him to say so.

  **Presenter:** What about jokes?

  **Marcus:** Oh, jokes are a nightmare. Humour rarely survives translation. A colleague of mine once admitted that she'd simply told the audience, in Spanish, "The speaker has just told a joke. It doesn't translate, but he'd be grateful if you laughed." And they did, right on cue. The speaker was delighted. He told her afterwards that he'd never had such a good reaction.

  **Presenter:** Is it true that interpreters always work in pairs?

  **Marcus:** For anything longer than half an hour, yes. We take turns, usually every thirty minutes, because concentration drops off sharply after that. The one who isn't speaking isn't resting, though. They're writing down numbers and names for their partner, checking terminology, passing notes. People are often surprised to hear that the silent interpreter is working almost as hard as the one at the microphone.

  **Presenter:** Is there ever pressure to soften what someone says?

  **Marcus:** Very much so, and it's the part of the job I find hardest. Some years ago, a delegate accused another country of lying, in fairly undiplomatic language. His own team asked me afterwards whether I could have chosen a milder word. I told them that wasn't my decision to make. My job is to report what was said, not to improve it. If a speaker is rude, the audience has a right to know that.

  **Presenter:** Has technology changed things?

  **Marcus:** Enormously. Machine translation is remarkably good now for written texts, and people regularly ask me whether I'm worried about losing my job. I'm not, or not yet. Machines are good at words, but they're still poor at the things that matter most in a live room: tone, irony, the moment when someone says "yes" but clearly means "absolutely not". Mind you, I said much the same thing ten years ago about written translation, and look what happened there.

  **Presenter:** And finally, what advice would you give someone who's thinking of becoming an interpreter?

  **Marcus:** Read widely, far beyond your own field. On any given day, I might be interpreting a debate on fishing rights in the morning and a conference on heart surgery in the afternoon. The interpreters who last aren't necessarily the best linguists. They're the ones who are curious about everything. Oh, and look after your voice. Nobody tells you that at the start.

  **Presenter:** Marcus Bell, thank you very much.
items:
  - q: "According to Marcus, what is the essence of interpreting?"
    options: ["Translating every word as accurately as possible.", "Speaking at least as fast as the speaker.", "Conveying what the speaker intends to say.", "Concentrating for long periods without a break."]
    answer: 2
    explain: "*What you're really doing is reporting what someone means… not \"What did she say?\" but \"What is she trying to tell them?\"* Переводить каждое слово — то, от чего его **предостерегал** тренер (*warned me that if I tried…*)."
  - q: "What does Marcus imply about the minister's speech?"
    options: ["The interpreters did not manage to translate all of it.", "The delegate had not understood most of it.", "The minister apologised for reading it too fast.", "It was shorter than the interpreters had expected."]
    answer: 0
    explain: "*congratulated us on keeping up. We hadn't, entirely* — *We hadn't* = we hadn't kept up: успели не всё. Министр извинился за опоздание (*apologised for running late*), а не за скорость."
  - q: "Why does Marcus tell the story about his colleague and the joke?"
    options: ["To show how easily audiences can be fooled.", "To criticise her for being unprofessional.", "To suggest that speakers should avoid humour.", "To illustrate a clever solution to an impossible task."]
    answer: 3
    explain: "*Humour rarely survives translation* — задача невыполнима, а коллега нашла выход, и *the speaker was delighted*. *admitted that she'd simply told…* — пересказ её признания."
  - q: "What is Marcus's attitude to softening a speaker's words?"
    options: ["He is willing to do it if the speaker's team asks.", "He thinks it is sometimes necessary in diplomacy.", "He refuses because it would misrepresent the speaker.", "He feels the audience should decide what is acceptable."]
    answer: 2
    explain: "*My job is to report what was said, not to improve it.* Команда делегата **просила** смягчить (*asked me whether I could have chosen a milder word*), а он отказал: *that wasn't my decision to make*."
  - q: "How does Marcus feel about machine translation?"
    options: ["Certain that it will never replace interpreters.", "Fairly secure for now, but unsure about the future.", "Worried that it is already taking his work.", "Impressed by how well it deals with irony."]
    answer: 1
    explain: "*I'm not [worried], or not yet… Mind you, I said much the same thing ten years ago… and look what happened there.* Уверенность с оговоркой — не «никогда»."
  - q: "What does Marcus see as the key to a long career as an interpreter?"
    options: ["Curiosity about a wide range of subjects.", "Outstanding ability in foreign languages.", "Specialising in one technical field.", "Having a naturally strong voice."]
    answer: 0
    explain: "*The interpreters who last aren't necessarily the best linguists. They're the ones who are curious about everything.* Про голос — совет беречь его, а не природное качество."
