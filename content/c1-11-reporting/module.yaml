title: "C1 · 11. Косвенная речь"
level: c1
book: book-advanced
summary: "Оформляешь прямую речь по правилам английской пунктуации, решаешь, нужен ли сдвиг времён, подбираешь точный reporting verb под его модель и передаёшь вопросы, приказы и советы в формальном стиле: insist that he be, recommend that staff (should) attend, wondered whether to."
topics:
  - "Прямая речь: пунктуация, said John / he said, цитата в цитате"
  - "Косвенная речь: указательные слова, необязательный и обязательный сдвиг времён, модальные"
  - "Reporting verbs по моделям: that, объект + that, to do, объект + to do, -ing, summary reports"
  - "Косвенные вопросы, whether to, приказы, просьбы, советы и мнения; insist / recommend that sb (should) do"
  - "Безличный и академический пересказ: it is said / X is said to have done, reportedly / allegedly, according to, глаголы позиции автора"
sources:
  - {title: "Oxford Practice Grammar Advanced — косвенная речь и reporting verbs", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
