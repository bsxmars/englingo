title: "4. Условные предложения"
summary: "Говоришь о реальных и нереальных условиях в настоящем, будущем и прошлом, смешиваешь их, когда прошлое влияет на настоящее, и выражаешь сожаления через wish, if only и would rather."
topics:
  - "Zero, first, second conditional"
  - "unless / as long as / provided (that) / in case"
  - "Другие «если»: even if, only if, in case, supposing, otherwise, but for"
  - "Third conditional и mixed conditionals"
  - "wish / if only, it's time, would rather"
sources:
  - {title: "Oxford Practice Grammar — разделы об условных предложениях и wish", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: First, Second and Third Conditionals", url: "https://www.perfect-english-grammar.com/first-second-third-conditionals-exercise.html"}
