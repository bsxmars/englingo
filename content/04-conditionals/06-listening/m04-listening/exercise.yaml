transcript: |
  **Presenter:** Today on *Second Chances* I'm talking to Rachel Moore, who was a professional cyclist until a crash eight years ago. She's now the author of eleven children's books. Rachel, does it still hurt to talk about the accident?

  **Rachel:** Not any more. People expect me to say, "if only it hadn't happened". But honestly, if I hadn't crashed, I wouldn't be doing a job I love. I'd probably still be training six hours a day, and my knees would be in a terrible state.

  **Presenter:** What do you remember about that day?

  **Rachel:** It was raining, and the road was covered in leaves. My coach had told me that morning that if the weather got any worse, I should pull out of the race. I wish I'd listened to him. But I was twenty-four, and I thought nothing could happen to me.

  **Presenter:** So how did the books start?

  **Rachel:** By accident, really. I was in hospital for two months, and my nephew used to visit every Sunday. He was six and always bored, so I started making up stories about a cat who rides a bicycle. If he hadn't kept asking what happened next, I'd never have written any of it down.

  **Presenter:** Was it easy to find a publisher?

  **Rachel:** Not at all. Nine publishers turned me down. The tenth said they'd take the book provided I changed the ending. In my version, the cat lost the race, you see. They said children wouldn't buy it unless the cat won.

  **Presenter:** And did you change it?

  **Rachel:** I did, and I'm still slightly annoyed about it, to be honest. Mind you, the book sold forty thousand copies in its first year, so maybe they had a point.

  **Presenter:** You visit a lot of schools. What do the children ask you?

  **Rachel:** Mostly whether the cat is real! But the older ones sometimes ask what they should do if their dream doesn't work out. And I tell them, as long as you stay curious, you'll find something else to love. It might not be the thing you planned, that's all.

  **Presenter:** And do you still cycle?

  **Rachel:** Every day, but slowly, and only on cycle paths. And I always carry a notebook in case I get an idea on the way. Half of my stories have started on a bike.

  **Presenter:** Rachel Moore, thank you very much.
