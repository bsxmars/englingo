title: "Part 4: The zero-waste restaurant"
type: listening
intro: "Послушай радиоинтервью с Рейчел Мур, владелицей ресторана без отходов, и выбери ответ. Вопросы идут по порядку записи."
hints:
  - "Ответ чаще звучит после although, however, whereas, чем до них."
  - "Инверсия и cleft sentences выделяют главное: Only when… did they, What they like is…"
