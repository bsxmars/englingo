transcript: |
  **Presenter:** Welcome to *Food Matters*. I'm here with Rachel Moore, whose restaurant in Bristol hasn't sent any rubbish to landfill for three years. Rachel, why did you decide to go zero-waste?

  **Rachel:** Honestly, it started as a money problem rather than an environmental one. When we opened, we were throwing away about a third of the food we bought. Not only was that terrible for the planet, it was killing the business.

  **Presenter:** So what did you change first?

  **Rachel:** The menu. Instead of offering twenty dishes, we now offer six, and they change every day depending on what our suppliers have. Although some customers complained at first, most of them actually prefer it now. What they like is the surprise.

  **Presenter:** And what happens to the food you don't use?

  **Rachel:** Very little is left over these days, but whatever there is goes to a farm down the road, where it's fed to the pigs. In return, the farmer sells us pork at a lower price. So it's a circle, really.

  **Presenter:** Isn't all this more expensive, though?

  **Rachel:** In some ways, yes. Our staff costs are higher, due to the fact that everything takes longer to prepare. Whereas a normal kitchen buys chopped vegetables, we buy everything whole and use every part. However, we spend much less on ingredients, so overall it comes out about the same.

  **Presenter:** What has been the hardest part?

  **Rachel:** Packaging, without a doubt. Suppliers love plastic. It took me nearly a year to find a fish supplier who'd deliver in reusable boxes. Only when I threatened to go elsewhere did they agree to try it.

  **Presenter:** Have other restaurants followed your example?

  **Rachel:** A few have, and I'm always happy to share what we've learned. But I'd be lying if I said it was easy. You need staff who really believe in it. Otherwise, they cut corners the moment you're not looking.

  **Presenter:** Finally, what would you say to someone who wants to waste less at home?

  **Rachel:** Start by looking in your bin. Seriously. Most people have no idea what they throw away. Once you know that, you can plan your shopping so that you only buy what you'll actually eat.

  **Presenter:** Rachel Moore, thank you very much.
