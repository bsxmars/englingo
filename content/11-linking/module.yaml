title: "11. Связность текста"
summary: "Связываешь мысли так, как ждут на B2: противопоставляешь через although и despite, объясняешь причины и цели, расставляешь акценты с помощью cleft sentences и инверсии — и пишешь эссе, которое читается гладко."
topics:
  - "although / though / even though / despite / in spite of / however / whereas"
  - "Причина, следствие и цель: because of, due to, therefore, so that, in order to"
  - "Связки между предложениями: in addition, besides, on the other hand, on the contrary, instead, after all"
  - "so … that / such … that"
  - "Cleft sentences, инверсия, усилительное do"
  - "Инверсия: not until, only when, under no circumstances, little did I know; Had I known, Should you need"
  - "Эссе B2 First со связками"
sources:
