title: "9. Артикли и существительные"
summary: "Перестаёшь угадывать артикли: знаешь, когда a/an, когда the, а когда ничего. Не говоришь «an advice» и «informations», уверенно выбираешь между few и a few, any и no, each и every."
topics:
  - "a/an, the и нулевой артикль"
  - "Артикли в общих утверждениях: cars или the cars, the rich, most people"
  - "Исчисляемые и неисчисляемые существительные"
  - "much / many / a lot of, a few / few / a little / little"
  - "Согласование: news is, the police are, a number of / the number of; a shoe shop, a ten-minute walk; such a / what a"
  - "some / any / no, all / both / either / neither / none / each / every"
