title: "10. Порядок слов и вопросы"
summary: "Перестаёшь переносить в английский свободный русский порядок слов: правильно ставишь наречия и прилагательные, задаёшь любые вопросы, включая косвенные и разделительные, и уверенно сравниваешь."
topics:
  - "Порядок слов: SVO, место наречий, enough, порядок прилагательных"
  - "Наречия степени: very / absolutely, quite / rather, too … to, (not) … enough"
  - "Вопросы: к подлежащему и к дополнению, косвенные, question tags, отрицательные"
  - "Короткие ответы и реакции: Yes, I do; So do I / Neither do I; I think so / I hope not"
  - "Сравнительная и превосходная степени, as … as, the more … the more"
