    options: ["It has become harder in every way.", "It is harder in some ways and easier in others.", "She now spends more time doing research in libraries."]
    answer: 1
    explain: "*In some ways, yes… But it's also far easier to find information.* *far easier* — усиленное сравнение. В библиотеке она теперь *rarely*."
