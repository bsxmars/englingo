    options: ["She doesn't enjoy quizzes.", "She knows very little about sport and geography.", "The team think it would give them an unfair advantage."]
    answer: 2
    explain: "*his team won't let me join. They say it wouldn't be fair.* Спорт и география — ловушка: она шутит, что как раз в них слаба."
