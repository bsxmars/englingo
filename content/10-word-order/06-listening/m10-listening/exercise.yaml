title: "Part 4: The quiz writer"
type: listening
intro: "Послушай радиоинтервью с Меган Росс, автором вопросов для телевикторины, и выбери ответ. Вопросы идут по порядку записи."
hints:
  - "Мнение «других людей» в записи — частая ловушка: ответ обычно после but."
  - "hardly ever, rarely, never — отрицание без not."
audio: audio/tts/10/interview.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-IE-ConnorNeural, en-US-JennyNeural", license: "TTS"}
transcript: |
  **Presenter:** You're listening to *Working Lives*. My guest today writes questions for one of the country's most popular TV quiz shows. Megan Ross, welcome.

  **Megan:** Thanks for having me.

  **Presenter:** So, how exactly does somebody become a quiz writer? It's not something you can study at university, is it?

  **Megan:** No, it isn't! I was actually a librarian. A friend of mine worked for a TV company, and one day she asked me whether I'd ever thought about writing questions. I said no, but I sent her twenty anyway, and they used three of them. That's how it started.

  **Presenter:** What makes a good question?

  **Megan:** People often think the hardest questions are the best ones, but that's not true at all. A good question is one that you feel you should know. If the people at home shout out the answer a second too late, that's perfect. If nobody has a clue, it's just frustrating.

  **Presenter:** How do you check that your answers are right?

  **Megan:** Very carefully! Every fact has to come from at least two reliable sources. And we always ask ourselves whether there could be a second correct answer. Years ago, before I joined, the show had to give a contestant his money back because a question had two possible answers. Nobody's forgotten that.

  **Presenter:** Do viewers ever complain?

  **Megan:** Not often, but they do write to us. My favourite letter was from a man who wanted to know why we never asked any questions about fishing. So I wrote a whole round about fishing, and he watched it, and he didn't get a single one right.

  **Presenter:** Is the job harder than it used to be?

  **Megan:** In some ways, yes. Everyone has a phone now, so people can check facts instantly, and they're much quicker to tell you you're wrong. But it's also far easier to find information. When I started, I spent hours in the library. Now I rarely leave my desk.

  **Presenter:** Do you ever take part in quizzes yourself?

  **Megan:** Hardly ever, actually. My husband loves pub quizzes, but his team won't let me join. They say it wouldn't be fair, which is funny, because I'm terrible at sport and geography.

  **Presenter:** And finally, which question are you proudest of?

  **Megan:** Oh, that's difficult. There's one about which animal sleeps the most. But no, I'm not going to tell you the answer. You might hear it on the show one day.

  **Presenter:** Megan Ross, thank you.
