  - q: "According to Megan, a good quiz question is one that"
    options: ["very few people can answer.", "viewers feel they ought to know.", "the audience can answer immediately."]
    answer: 1
    explain: "*A good question is one that you feel you should know.* Самые трудные вопросы — мнение других: *but that's not true at all*."
