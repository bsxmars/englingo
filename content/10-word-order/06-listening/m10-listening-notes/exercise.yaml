title: "Part 2: Four days on a train"
type: listening
intro: "Послушай рассказ путешественницы о поезде через Канаду и впиши в каждый пропуск одно–три слова, которые прозвучали в записи."
hints:
  - "Слово для пропуска звучит дословно; сравнения в задании перефразированы."
  - "Чисел в записи много — дослушай, к чему относится каждое."
audio: audio/tts/10/talk.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-AU-NatashaNeural", license: "TTS"}
transcript: |
  Hi everyone. When people ask me what the best journey of my life was, they usually expect me to say something exotic. But honestly, it was a train. Four nights from Toronto to Vancouver, across more than four thousand kilometres of Canada.

  Now, it's definitely not the fastest way to cross the country. A plane takes about five hours. The train takes about four days, and it's almost always late. On my trip we arrived nine hours behind schedule, and nobody seemed to mind.

  I'd booked the cheapest ticket, which gets you a seat rather than a bed. That was a mistake. The seats are comfortable enough for a day, but not for four nights. On the second day I paid extra for a cabin, which was smaller than my bathroom at home, but I slept far better.

  The thing I hadn't expected was how quickly I'd get to know people. There's a dome car with a glass roof, and you simply can't sit there without talking to strangers. I met a retired dentist from Winnipeg who'd done the journey eleven times. I asked him why he kept coming back, and he said the view was never the same twice.

  The landscape changes slowly at first. Northern Ontario is mostly forest and lakes, and for a whole day you hardly see a town. Then come the prairies, which are flatter than anything I'd ever seen. Some passengers found them boring. I found them the most relaxing part of the trip.

  But the Rockies are, of course, the highlight. The train climbs higher and higher, and the closer you get to the mountains, the quieter everyone becomes. I've never heard a carriage so silent.

  The food was much better than I'd expected. Meals are served in the dining car at fixed times, and you always share a table, so you rarely eat with the same people twice.

  If you're thinking of going, my advice is simple: go in autumn. It's cheaper than summer, the trains are less crowded, and the colours are absolutely incredible. And take a good book, because there's no wifi for most of the journey.
items:
  - q: "Flying across Canada takes about ___ hours."
    answers: ["five", "5"]
    explain: "*A plane takes about **five** hours. The train takes about four days.* Девять часов — опоздание поезда."
  - q: "On the speaker's trip, the train arrived ___ hours late."
    answers: ["nine", "9"]
    explain: "*we arrived **nine** hours behind schedule* — *behind schedule* = с опозданием."
  - q: "With the cheapest ticket, passengers get a ___ instead of a bed."
    answers: ["seat", "a seat"]
    explain: "*the cheapest ticket, which gets you a **seat** rather than a bed.* *comfortable enough for a day* — *enough* стоит после прилагательного."
  - q: "Her cabin was even smaller than her ___ at home."
    answers: ["bathroom"]
    explain: "*a cabin, which was smaller than my **bathroom** at home, but I slept far better.*"
  - q: "The dome car has a roof made of ___."
    answers: ["glass"]
    explain: "*a dome car with a **glass** roof* — в задании перефразировано: *a roof made of glass*."
  - q: "On the train she met a retired ___ from Winnipeg."
    answers: ["dentist"]
    explain: "*I met a retired **dentist** from Winnipeg.*"
  - q: "This man had made the same journey ___ times."
    answers: ["eleven", "11"]
    explain: "*who'd done the journey **eleven** times. I asked him why he kept coming back* — косвенный вопрос: *why he kept*, не *why did he keep*."
  - q: "The speaker found the ___ the most relaxing part of the journey."
    answers: ["prairies", "the prairies"]
    explain: "*the **prairies**, which are flatter than anything I'd ever seen… I found them the most relaxing part.* Скучными их считали другие пассажиры."
  - q: "The closer the train gets to the Rockies, the ___ the passengers become."
    answers: ["quieter"]
    explain: "*the closer you get to the mountains, the **quieter** everyone becomes* — конструкция *the + comparative…, the + comparative*."
  - q: "She recommends travelling in ___."
    answers: ["autumn", "the autumn", "fall", "the fall"]
    explain: "*go in **autumn**. It's cheaper than summer, the trains are less crowded* — *less crowded* = *not as crowded as*."
