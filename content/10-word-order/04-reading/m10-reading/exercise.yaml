text: |
  ## Lisbon or Tbilisi? One year, two cities

  When I started working remotely three years ago, I made a promise to myself: I would spend at least six months in every city I lived in, so that I could judge it fairly. Last year I kept that promise twice — first in Lisbon, then in Tbilisi. People often ask me which one is better. The honest answer is that it depends on what you value most.

  Let's start with money, because for most remote workers it matters more than anything else. Tbilisi is far cheaper. My one-bedroom flat in the old town cost roughly half as much as a smaller place in Lisbon, and eating out was so affordable that I almost stopped cooking. Lisbon used to be one of the cheapest capitals in Western Europe, but those days are gone. Rents have risen faster than salaries, and many locals now find it harder and harder to live in the centre. As a foreigner earning a foreign salary, I sometimes felt slightly uncomfortable about that.

  When it comes to work, Lisbon wins easily. The internet in my flat was faster and more reliable than in Tbilisi, where I lost my connection during calls more often than I would like to admit. Lisbon also has more co-working spaces than I could count, and the remote-work community is much bigger and better organised. There is a meetup almost every evening, so you are never as isolated as you might be in a smaller scene. Time zones matter too: Lisbon is on the same time as London, which made meetings with my team a lot easier. In Tbilisi, my working day finished three or four hours later than theirs.

  The weather is a closer contest. Lisbon's winters are milder, and the city gets more sunshine than almost any other European capital. Tbilisi has hotter summers and colder winters, but the autumn there was the most beautiful I have ever seen — warm, golden and quiet.

  What about people? This is where Tbilisi surprised me most. I have never been invited to so many family dinners by people I had only just met. Georgians are, without doubt, the most generous hosts I have ever known. Lisbon is friendly too, but in a more reserved way, and the more tourists there are in a neighbourhood, the less locals seem to want to chat with strangers — which is understandable.

  So which city would I choose? If my priority were my career, I would go back to Lisbon without thinking twice: the infrastructure is simply better, and it is easier to meet people who do the same job as you. But if I wanted to save money, slow down and feel like a guest rather than a customer, Tbilisi would be my first choice. The longer I think about it, the less I believe in a "best" city. There is only the best city for a particular year of your life.
