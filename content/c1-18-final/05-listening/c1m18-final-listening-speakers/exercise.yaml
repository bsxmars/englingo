transcript: |
  *Part four. You will hear five short extracts in which people talk about moving from a city to the countryside.*

  *Speaker one.*

  People assume we left for the peace and quiet, but honestly, it was the rent. We were paying well over half of what we earned just to live in a two-bedroom flat, and saving was out of the question. Out here we pay about a third of that for a house with a garden. The thing nobody warns you about is how long it takes to be accepted. It wasn't until our second winter, when our car broke down in the snow and three neighbours turned up with shovels, that I felt we actually belonged.

  *Speaker two.*

  My doctor had been urging me for years to cut down on stress, and in the end she told me quite bluntly that if I stayed in my job in London, she couldn't answer for the consequences. So I left. I'd worried that I'd be bored to death in the country. As it turns out, I needn't have worried about boredom at all. What I should have worried about was the silence. For the first few months, I'd lie awake at night, listening for traffic that never came.

  *Speaker three.*

  I was offered a post at an agricultural research station, which happens to be about forty miles from the nearest town, so moving wasn't really a choice. The house is lovely, there's plenty of room, and I don't mind the driving. But I do miss the theatre terribly. In the city I'd go two or three times a month. If I'd known how much I'd miss it, I might have thought twice about accepting the job, though I'd probably still have taken it in the end.

  *Speaker four.*

  Our main reason was the kids. The school they'd have gone to in the city had been heavily criticised in an inspection, and it was said to be struggling to keep its teachers. The village school here is tiny, and they love it. The weather doesn't bother me, and I've got used to the quiet. What drives me up the wall is the internet. Fast broadband is something people in cities simply take for granted. Out here, a connection that lasts a whole video call is a luxury.

  *Speaker five.*

  My wife and I had been meaning to open a bakery for years, and property in the city was just too expensive to even think about it. So we bought an old farmhouse with an outbuilding we could turn into a shop. Business has been better than we hoped, and the locals have been very welcoming. The heating bills, though, came as a real shock. Our first winter, they were eye-watering. I regret not having had the roof properly insulated before we moved in. We've had to tighten our belts considerably.
