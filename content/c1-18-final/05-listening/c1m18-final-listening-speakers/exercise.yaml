title: "Итоговый тест C1: Listening, Part 4"
type: listening
intro: |
  Запись в формате C1 Advanced Part 4: пять человек рассказывают о переезде из города в деревню. В **Task 1** выбери причину переезда каждого, в **Task 2** — что каждому даётся труднее всего. В каждой задаче три варианта лишние. Прослушай запись дважды. Для зачёта нужно **60 %**.
hints:
  - "За первое прослушивание реши Task 1, за второе — Task 2."
  - "Каждый говорящий упоминает и лишний вариант — с оговоркой или отрицанием."
pass: 60
