title: "Итоговый тест C1: Listening, Parts 1 и 3"
type: listening
intro: |
  Запись в формате C1 Advanced: **Part 1** — четыре коротких отрывка, по два вопроса с тремя вариантами; **Part 3** — интервью, шесть вопросов с четырьмя вариантами. Вопросы идут по порядку записи. Прослушай запись дважды, как на экзамене, и только потом проверяй. Для зачёта нужно **60 %**.
hints:
  - "Перед каждым отрывком звучит, кто говорит и о чём: прочитай вопросы к нему, пока идёт вступление."
  - "Неверные варианты звучат в записи — как чужое мнение, гипотеза или то, что было раньше."
pass: 60
audio: audio/tts/c1-18/parts13.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-GB-SoniaNeural, en-GB-ThomasNeural, en-US-JennyNeural, en-AU-NatashaNeural, en-GB-RyanNeural, en-GB-LibbyNeural, en-US-AndrewNeural, en-IE-ConnorNeural", license: "TTS"}
transcript: |
  *Part one. You will hear four different extracts. For each one, answer two questions.*

  *Extract one. You hear two friends talking about an exhibition.*

  **Man:** You went to the Vermeer exhibition in the end, didn't you?

  **Woman:** I did. I needn't have booked, as it turned out. The place was half empty on a Tuesday morning.

  **Man:** Really? I was told it had been sold out for weeks.

  **Woman:** You must have been looking at the weekend slots. Anyway, I have to say, it wasn't quite what I'd expected.

  **Man:** Oh? Didn't you tell me it was the one exhibition you weren't going to miss this year?

  **Woman:** I did, and the paintings themselves were extraordinary. It's just that there were only about a dozen of them, and the rest was screens and audio guides. I can't help feeling they might have trusted the art a bit more.

  **Man:** That's the trend now, isn't it? Everything has to be an experience.

  **Woman:** Exactly. Still, I wouldn't put you off going. Just don't expect to spend more than an hour there.

  *Extract two. You hear two radio presenters talking about a local bridge.*

  **Presenter:** Now, the old swing bridge finally reopened this morning, after nearly three years. Tom, you were there.

  **Tom:** I was. It's said to have cost almost twice the original estimate, which the council has been rather quiet about. But I have to admit, it looks wonderful. The ironwork has been restored rather than replaced, so it's essentially the same bridge your great-grandparents would have walked across.

  **Presenter:** And I gather it still swings?

  **Tom:** It does, though it'll only be opened for boats twice a day. Apparently the mechanism got badly damaged in the floods, and that's partly what caused the delays.

  **Presenter:** What did people make of it?

  **Tom:** The mood was mostly positive. One woman told me she'd been taking the bus the long way round for three years and had almost forgotten the river was there. Mind you, not everyone's delighted. Neither of the cycling groups I spoke to is happy that bikes have to be pushed across.

  *Extract three. You hear two colleagues talking about a training course.*

  **Woman:** How was the leadership course?

  **Man:** Better than I'd feared. The trainer started by asking us to describe the worst manager we'd ever had, which I thought was a gimmick, but it actually worked rather well.

  **Woman:** Did she tell you anything you didn't already know?

  **Man:** Not much, if I'm honest. But she did persuade me to stop answering emails during meetings. She claimed people notice it far more than we think, and she suggested trying a whole week without it.

  **Woman:** And?

  **Man:** I've managed two days so far. What I really regret, though, is having agreed to chair so many meetings this month. I distinctly remember being told it would be a light term.

  **Woman:** You should have checked. Anyway, the course wasn't wasted if it changed one habit.

  *Extract four. You hear two podcast presenters discussing a piece of research.*

  **Woman:** There's a new study out suggesting that walking meetings lead to better decisions. What did you make of it?

  **Man:** Frankly, I'm sceptical. What they actually found is that people came up with more ideas while walking, which isn't the same thing as better decisions at all.

  **Woman:** Fair point. But the researchers do recommend that every company consider holding at least one walking meeting a week.

  **Man:** Well, they would, wouldn't they? Admittedly, the sample was larger than most, around four hundred people, and I can see the appeal. Whether it works for a budget meeting full of spreadsheets is another question entirely.

  **Woman:** So you won't be trying it?

  **Man:** Oh, I'll try it. I'm just not going to pretend that a stroll round the car park will transform the company.

  *Part three. You will hear an interview with a wildlife photographer, Mia Torres.*

  **Man:** My guest today is the wildlife photographer Mia Torres, whose pictures of snow leopards have appeared in magazines all over the world. Mia, you've been doing this for nearly twenty years. How did it begin?

  **Presenter:** Well, I'd been working as a lab technician for about five years, and I'd been taking photos on the side, mostly birds in the park near my flat. Then one of them won a small competition, and I suppose that gave me the courage to give up the day job. I've been freelance ever since.

  **Man:** Your best-known work comes from the Himalayas. What's it actually like, waiting for a snow leopard?

  **Presenter:** Mostly cold and boring! People imagine you just turn up and there it is. The first time, I spent eleven weeks in a hide and saw one on just two occasions, both a long way off. The second trip, I'd hardly set up the camera on the fourth morning when a female walked straight into the frame, as if she'd been waiting for me. Pure luck, mostly.

  **Man:** Do you ever feel you're disturbing the animals?

  **Presenter:** All the time, and I think anyone who says they don't isn't being honest. I have a rule now: if an animal changes its behaviour because of me, I back off. Had I followed that rule early in my career, I'd have fewer dramatic photos, but I'd feel a lot better about them.

  **Man:** There's been a lot of debate about digitally altered images in competitions. Where do you stand?

  **Presenter:** I'm fairly strict. Adjusting the light is one thing; removing a branch, or adding one, is quite another. A few years ago a competition had to disqualify a photographer whose winning picture turned out to show a stuffed animal, which did enormous damage to everyone's credibility, not just his.

  **Man:** You also run workshops for young photographers. What do you tell them?

  **Presenter:** To slow down. Most of them want the perfect shot on day one, and when they don't get it, they give up on the whole idea. I tell them to pick one place near home and keep going back to it. You learn far more from one park visited fifty times than from fifty parks visited once.

  **Man:** And what's next for you?

  **Presenter:** Something closer to home, actually. I've been asked to photograph urban foxes in London, and I've said I will. My family think I've lost my mind, swapping mountains for rubbish bins. Perhaps I have. But if someone's going to show that cities are full of wildlife, it may as well be me.
items:
  - q: "Part 1, Extract 1. What does the woman say about booking a ticket?"
    options: ["It turned out to be unnecessary.", "She should have done it much earlier.", "Only weekend tickets were available."]
    answer: 0
    topic: "c1-02-modals"
    explain: "*I **needn't have booked**, as it turned out. The place was half empty* — *needn't have + V3*: сделала, но зря. *You must have been looking at the weekend slots* — вывод о мужчине, а не о ней."
  - q: "Part 1, Extract 1. Why does the man ask, 'Didn't you tell me it was the one exhibition you weren't going to miss?'"
    options: ["He is surprised by her lack of enthusiasm.", "He is reminding her of a promise to take him.", "He wants to know whether she went alone."]
    answer: 0
    topic: "c1-03-negatives-questions"
    explain: "Отрицательный вопрос *Didn't you tell me…?* выражает удивление: он ожидал восторга, а она говорит *it wasn't quite what I'd expected*."
  - q: "Part 1, Extract 2. What does Tom suggest about the cost of the bridge?"
    options: ["It was lower than first predicted.", "The council has not drawn attention to it.", "It was the main reason for the delays."]
    answer: 1
    topic: "c1-04-passive"
    explain: "*It's said to have cost almost twice the original estimate, which the council has been rather quiet about.* *be said to have done* — безличный пассив о прошлом. Задержки вызвали повреждения при наводнении."
  - q: "Part 1, Extract 2. How did local people react to the reopening?"
    options: ["Everyone Tom spoke to was delighted.", "Most were positive, but some groups were unhappy.", "Few people had noticed the bridge was closed."]
    answer: 1
    topic: "c1-06-determiners"
    explain: "*The mood was **mostly** positive… **not everyone's** delighted. **Neither** of the cycling groups… is happy.* *Neither of* + глагол в единственном числе."
  - q: "Part 1, Extract 3. What did the trainer persuade the man to do?"
    options: ["Chair fewer meetings.", "Stop dealing with emails in meetings.", "Describe his worst manager to his team."]
    answer: 1
    topic: "c1-11-reporting"
    explain: "*she did **persuade me to stop** answering emails during meetings. She **claimed**… she **suggested trying**…* — reporting verbs со своими моделями: *persuade sb to do*, *suggest doing*."
  - q: "Part 1, Extract 3. How does the man feel about his workload this month?"
    options: ["He wishes he had not taken on so much.", "He thinks it will be lighter than he was told.", "He blames the trainer for the extra meetings."]
    answer: 0
    topic: "c1-10-infinitives-gerunds"
    explain: "*What I really regret… is **having agreed** to chair so many meetings* — перфектный герундий: сожаление о прошлом действии. *remember being told* — пассивный герундий."
  - q: "Part 1, Extract 4. What does the man say about the study?"
    options: ["It used too small a sample.", "It showed more ideas, not necessarily better decisions.", "It proved that walking meetings save time."]
    answer: 1
    topic: "c1-12-noun-clauses"
    explain: "*What they actually found is **that** people came up with more ideas… which isn't the same thing as better decisions.* Придаточное-подлежащее *What they found* и *Whether it works… is another question*. Выборка, наоборот, *larger than most*."
  - q: "Part 1, Extract 4. What is the man's attitude to walking meetings?"
    options: ["He refuses to consider them.", "He will try them but doubts they will change much.", "He is convinced they will transform the company."]
    answer: 1
    topic: "c1-08-adjectives-adverbs"
    explain: "*Frankly, I'm sceptical… **Admittedly**…* — comment adverbs задают отношение; итог: *Oh, I'll try it. I'm just not going to pretend…*"
  - q: "Part 3. What led Mia to become a professional photographer?"
    options: ["She lost her job as a lab technician.", "A competition success gave her confidence.", "She had studied photography for five years.", "A magazine offered her regular work."]
    answer: 1
    topic: "c1-01-sentences-tenses"
    explain: "*I'd been working as a lab technician… Then one of them won a small competition, and… that gave me the courage* — Past Perfect Continuous фон, Past Simple — событие. Пять лет — стаж лаборанта, а не учёбы."
  - q: "Part 3. What does Mia say about her second trip to the Himalayas?"
    options: ["She had to wait even longer than on the first.", "She succeeded early, largely by chance.", "She saw several leopards close up.", "She used a different kind of hide."]
    answer: 1
    topic: "c1-15-adverbial-clauses"
    explain: "*I'd **hardly** set up the camera on the fourth morning **when** a female walked straight into the frame, **as if** she'd been waiting for me. Pure luck* — *hardly… when* = «едва… как»."
  - q: "Part 3. What does Mia imply about some of her early photographs?"
    options: ["They are the best she has ever taken.", "She feels uneasy about how she got them.", "Other photographers copied them.", "She now refuses to publish them."]
    answer: 1
    topic: "c1-14-conditionals"
    explain: "*Had I followed that rule early in my career, I'd have fewer dramatic photos, but I'd feel a lot better about them* — смешанное условие с инверсией: правилу она не следовала и сейчас чувствует неловкость."
  - q: "Part 3. Why does Mia mention the disqualified photographer?"
    options: ["To show that one case of cheating harmed trust in everyone.", "To argue that judges are too strict.", "To explain why she never adjusts the light.", "To suggest that stuffed animals are often used."]
    answer: 0
    topic: "c1-13-relative-clauses"
    explain: "*a photographer **whose** winning picture… showed a stuffed animal, **which** did enormous damage to everyone's credibility, not just his* — *which* оценивает весь факт. Корректировать свет она, наоборот, допускает."
  - q: "Part 3. What advice does Mia give young photographers?"
    options: ["Travel to as many places as possible.", "Keep returning to one place close to home.", "Aim for the perfect shot from the first day.", "Give up if results do not come quickly."]
    answer: 1
    topic: "c1-09-prepositions"
    explain: "*pick one place near home and **keep going back to** it* — фразовые глаголы *go back to*, *give up on*, *back off* несут смысл реплики. *the perfect shot on day one* — ошибка новичков."
  - q: "Part 3. How does Mia feel about her next project?"
    options: ["She has turned it down.", "She agrees with her family that it is a mistake.", "She is willing to do it despite others' doubts.", "She would rather go back to the mountains."]
    answer: 2
    topic: "c1-07-pronouns-ellipsis"
    explain: "*I've said I **will**… Perhaps I **have**.* — эллипсис: *will (photograph them)*, *have (lost my mind)*. Шутливо соглашаясь, она всё равно берётся: *it may as well be me*."
