text: |
  ## Worth the queue? A visit to "Light Years" at the City Gallery

  I have to admit that I went to "Light Years", the new exhibition at the City Gallery, expecting to be bored. Exhibitions about the history of lighting do not sound terribly exciting, and the first room did little to change my mind: a row of oil lamps in glass cases, each one labelled with a date and not much else. There was hardly anyone else there, and for a few minutes I wondered whether I had made a rather expensive mistake.

  Then I turned the corner, and everything changed. The second room is completely dark except for a single candle in the middle of the floor. You are asked to sit down on a low wooden bench and simply wait. After a minute or two your eyes adjust, and you begin to notice how much a tiny flame can actually show you: the faces of the people next to you, the shadows on the ceiling, the shape of the room itself. It is a surprisingly moving experience, and it made me think about how people lived for thousands of years before electricity.

  From there, the exhibition moves quickly through gas lamps, early light bulbs and neon signs. The curators have clearly worked hard to make the science easy to follow. Short videos explain how each technology works, and the texts on the walls are refreshingly free of jargon. Children will love the interactive section, where you can build a simple circuit yourself and light up a model of a city street. My only complaint is that this section gets far too crowded at weekends: I had to wait twenty minutes before there was enough space for me to try it.

  The highlight, for me, was the final room, which is devoted to the way artificial light has changed our cities and our bodies. A huge satellite image shows Europe at night, glowing like a spider's web, and next to it there is a fascinating — and slightly worrying — display about light pollution. Did you know that in some parts of the world, most people can no longer see the Milky Way from where they live? I certainly didn't, and I left the room feeling quite shocked.

  Not everything works equally well. The audio guide is poorly designed: the buttons are tiny, and the recordings are so long that most of the visitors I saw gave up after a few minutes. The gift shop, too, is rather disappointing, full of expensive lamps that have little to do with the ideas of the exhibition.

  Still, these are minor problems. "Light Years" is an intelligent, beautifully presented show that manages to be both educational and genuinely enjoyable. It is suitable for everyone from curious ten-year-olds to grandparents, although very young children may find the dark room frightening. Allow at least two hours, book online to avoid the queue, and if you can, go on a weekday morning, when the galleries are quiet enough to enjoy properly. I went expecting to be bored; I left absolutely delighted, and I have already told everyone I know to go.
