title: "14. Местоимения, прилагательные и наречия"
summary: "Перестаёшь путать there is и it is, говоришь enjoy yourself и each other без кальки, различаешь bored и boring, hard и hardly, quite и rather — и точно дозируешь оценку: very good, absolutely brilliant, not big enough."
topics:
  - "there или it; возвратные местоимения, each other, one / ones, everyone / something + else"
  - "there и it в устойчивых конструкциях (there's no point, it takes, it's worth, there seems to be); everyone + ед. ч., no one / none"
  - "Позиция прилагательных, the rich / the unemployed, -ed и -ing"
  - "Прилагательное или наречие: hard / hardly, late / lately, friendly, look / sound + прилагательное"
  - "Наречия степени: very / absolutely, quite / rather / pretty, too / enough, so / such"
sources:
  - {title: "Oxford Practice Grammar — разделы о местоимениях, прилагательных и наречиях степени", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: прилагательные на -ed и -ing", url: "https://www.perfect-english-grammar.com/participle-adjectives-exercise-1.html"}
  - {title: "Perfect English Grammar: наречие или прилагательное", url: "https://www.perfect-english-grammar.com/adverbs-or-adjectives-exercise-1.html"}
