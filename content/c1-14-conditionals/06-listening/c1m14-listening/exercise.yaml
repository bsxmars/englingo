transcript: |
  *Extract one. You hear two friends talking about a holiday that was cancelled.*

  **Kate:** So, did the airline ever give you your money back?

  **Sam:** Not a penny. And the annoying thing is, if I'd booked through the agency like I normally do, I'd be lying on a beach right now. Or at least I'd have a refund.

  **Kate:** Hang on, you didn't take out insurance?

  **Sam:** I was going to. But it was an extra forty pounds, and I thought, well, unless a volcano actually erupts, what could possibly go wrong?

  **Kate:** And then a volcano actually erupted.

  **Sam:** Not exactly. The airline went bust. Which, to be fair, nobody saw coming.

  **Kate:** Well, I'm not sure that's true. There were rumours for months. Had you been reading the business pages instead of football forums, you might have noticed.

  **Sam:** Thanks, Kate. That's very helpful.

  **Kate:** Sorry. Look, if it's any consolation, even if you'd bought the insurance, a lot of those policies don't cover the airline going under.

  **Sam:** Really? So I'd have been forty pounds poorer and still sitting at home.

  **Kate:** Possibly. Supposing you'd paid by credit card, though, you could claim it back from the card company.

  **Sam:** I paid by debit card.

  **Kate:** Ah. Well, I'd still have a quiet word with your bank. Provided you're polite and persistent, they sometimes help.

  *Extract two. You hear two colleagues discussing a proposal for a four-day working week.*

  **Woman:** Have you had a chance to look at the four-day week proposal?

  **Man:** I have. And I'll be honest, I'm in two minds. If it worked the way it does on paper, it'd be wonderful.

  **Woman:** But?

  **Man:** But it'll only work if the clients go along with it. If a client rings on a Friday and nobody picks up, we'll lose them, and then it won't matter how rested everyone feels.

  **Woman:** That's why there's a rota. Half the team off on Mondays, half on Fridays.

  **Man:** Oh. Well, if so, my main objection more or less disappears. I must have skipped that bit.

  **Woman:** Page six. Look, were we to try it for, say, three months, we'd at least have some real figures instead of arguing about it in the abstract.

  **Man:** And if the figures are bad?

  **Woman:** Then we go back to five days, no harm done. Whether or not it sticks, people will appreciate being asked.

  **Man:** Hmm. I'd support a trial, as long as it's a proper one, with targets agreed in advance. Otherwise everyone will just declare it a success at the end.

  **Woman:** That's fair. Will you say that at the meeting?

  **Man:** Only if you promise not to make me chair it.

  *Extract three. You hear two podcast presenters discussing a listener's email.*

  **Clare:** Our next email comes from Priya, who's in the second year of an engineering degree and has been offered funding to start her own company. She asks: should I leave university? Matt?

  **Matt:** Well, my gut reaction is, if the money's real, take it. Opportunities like that don't come round twice.

  **Clare:** See, I'd be far more cautious. Suppose she leaves and the company folds within a year, which, statistically, most of them do. Then she's got no degree and no business.

  **Matt:** But she could go back, couldn't she? Lots of universities let you pause your studies. If I were her, that's the first thing I'd check.

  **Clare:** OK, that's actually a fair point. If she can suspend her course rather than drop out, the whole thing looks very different. I'd be a lot happier with that.

  **Matt:** And honestly, but for my aunt lending me money when I was twenty-two, I'd never have started anything. I'd probably be in an office somewhere, wondering what might have been.

  **Clare:** You'd be a lot calmer, though.

  **Matt:** Calmer, maybe. Happier, I doubt it.

  **Clare:** So, Priya, here's our advice. Talk to your department first, and keep your options open in case things don't go to plan. And whatever you decide, don't let anyone, including us, make the decision for you.
items:
  - q: "Extract 1. What does Kate suggest about the airline's collapse?"
    options: ["Nobody could have predicted it.", "Sam could have been aware of the risk.", "It was mainly discussed on football forums."]
    answer: 1
    explain: "*Had you been reading the business pages… you **might have noticed**.* Инверсия третьего типа: Сэм не читал — а мог бы узнать. *nobody saw coming* — мнение Сэма, которое Кейт оспаривает."
  - q: "Extract 1. What does Kate advise Sam to do?"
    options: ["Take out insurance next time he travels.", "Contact his bank about the money.", "Use a credit card for future bookings."]
    answer: 1
    explain: "*I'd still have a quiet word with your bank. **Provided** you're polite and persistent, they sometimes help.* Страховка, по её словам, могла и не помочь, а кредитка — лишь гипотеза *Supposing you'd paid…*"
  - q: "Extract 2. What is the man's main concern at first?"
    options: ["Staff might not feel any more rested.", "Clients might be lost if no one is available.", "The proposal is too long to read properly."]
    answer: 1
    explain: "*it'll **only** work **if** the clients go along with it. If a client rings on a Friday and nobody picks up, we'll lose them.* *only if* — единственное условие успеха."
  - q: "Extract 2. What do the speakers agree on?"
    options: ["A trial should have targets set before it starts.", "The four-day week should be introduced at once.", "The man should chair the meeting."]
    answer: 0
    explain: "*as long as it's a proper one, with targets agreed in advance* — *That's fair.* Председательствовать он соглашается *Only if you promise not to make me chair it* — то есть не хочет."
  - q: "Extract 3. What is Clare's view at the beginning?"
    options: ["Priya should accept the funding straight away.", "Leaving university could leave Priya with nothing.", "Universities rarely allow students to return."]
    answer: 1
    explain: "*Suppose she leaves and the company folds… Then she's got no degree and no business.* *Suppose* вводит гипотетический сценарий. Взять деньги сразу советует Мэтт."
  - q: "Extract 3. What makes Clare change her opinion?"
    options: ["Matt's story about his aunt.", "The possibility of suspending the course.", "Statistics about new companies."]
    answer: 1
    explain: "*If she can suspend her course rather than drop out, the whole thing looks very different.* История про тётю (*but for my aunt…*) — личный пример Мэтта, который её не убеждает: *You'd be a lot calmer, though.*"
