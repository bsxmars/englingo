title: "Part 1: Three short extracts"
type: listening
intro: "Ты услышишь три отрывка с разными говорящими. К каждому — два вопроса; выбери лучший из трёх вариантов."
hints:
  - "Неверные варианты тоже звучат в отрывке — но как гипотеза, упрёк или чужое мнение."
  - "Условные предложения часто описывают то, чего НЕ было: Had you been reading… = ты не читал."
