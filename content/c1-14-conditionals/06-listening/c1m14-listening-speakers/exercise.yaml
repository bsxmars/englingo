title: "Part 4: Changing careers"
type: listening
intro: |
  Пять человек рассказывают, как сменили профессию. Задание из двух частей, как на экзамене: в **Task 1** выбери, что подтолкнуло каждого к переменам, в **Task 2** — что каждый говорит о своём решении сейчас. В каждой задаче три варианта лишние.
hints:
  - "Слушай запись целиком дважды: в первый раз реши Task 1, во второй — Task 2."
  - "Каждый говорящий упоминает и лишний вариант — с оговоркой: It wasn't that…, that came later, not really."
