title: "C1 · 14. Условные предложения"
level: c1
book: book-advanced
summary: "Выходишь за рамки «нулевого–третьего»: смешиваешь времена в реальных и нереальных условиях, пишешь формально через Had I known… и Should you need…, точно различаешь only if, even if, unless, whether or not и if so."
topics:
  - "Factual, predictive, hypothetical, counterfactual; will и would в if-части; were to"
  - "Смешанные времена в реальных и нереальных условиях; порядок частей, запятая, then"
  - "only if / if only, even if / even though, unless, whether or not, if so / if not"
  - "Инверсия: Had I known, Were it not for, Should you need; but for, otherwise, provided, supposing"
  - "Условие без if: provided / as long as / on condition that, in case / in the event of, assuming / given, suppose / say, otherwise, императив + and / or, but for / with"
sources:
  - {title: "Oxford Practice Grammar Advanced — Conditionals", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: First, Second and Third Conditionals", url: "https://www.perfect-english-grammar.com/first-second-third-conditionals-exercise.html"}
  - {title: "Perfect English Grammar: Inversion", url: "https://www.perfect-english-grammar.com/inversion-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
