title: "C1 · 13. Относительные придаточные"
level: c1
book: book-advanced
summary: "Пишешь плотные формальные предложения: whom и which с предлогом впереди, some of whom и in which case, сокращённые придаточные (the people living here, the first to arrive), the extent to which, whatever / whoever — и не путаешь what с which."
topics:
  - "who / whom / which / that в формальном и разговорном регистре; defining и non-defining; which о всём предложении"
  - "Сокращённые придаточные: -ing, -ed, being done, having been done, the first to do; whose и of which; those who"
  - "Предлог в начале и в конце: to whom, during which, the extent to which; фразовые глаголы"
  - "where / when / why / the way; what = «то, что»; whatever, whoever, whichever, wherever, however"
  - "Слова на -ever: «любой» и «неважно», however + прилагательное, no matter / it doesn't matter, Whatever the reason, Wherever possible, no doubt whatsoever"
sources:
  - {title: "Oxford Practice Grammar Advanced — Relative clauses", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: Who or Whom", url: "https://www.perfect-english-grammar.com/who-or-whom-exercise.html"}
  - {title: "Perfect English Grammar: Relative Clauses (4)", url: "https://www.perfect-english-grammar.com/relative-clauses-exercise-4.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
