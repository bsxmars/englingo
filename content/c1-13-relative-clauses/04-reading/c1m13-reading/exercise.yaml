    answers: ["custodians", "custodian"]
    explain: "*the staff, who act merely as **custodians*** — хранители, а не владельцы."
  - q: "Find a phrase in paragraph 4 that means 'how much' or 'to what degree'."
    answers: ["the extent to which", "extent to which"]
