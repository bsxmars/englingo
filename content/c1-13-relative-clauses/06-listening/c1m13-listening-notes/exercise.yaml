title: "Part 2: The repair café"
type: listening
intro: "Послушай выступление Деклана о кафе-мастерской и впиши в каждый пропуск одно–три слова, которые прозвучали в записи."
hints:
  - "Слово для пропуска звучит дословно; предложения задания перефразированы."
  - "Числа можно писать цифрами или словами."
audio: audio/tts/c1-13/talk.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-IE-ConnorNeural", license: "TTS"}
transcript: |
  Hi everyone, and thanks for having me. My name's Declan, and for the last four years I've been running a repair café in a church hall in Limerick, which, if you haven't come across the idea, is a sort of free workshop where people bring things that are broken and we try to fix them together.

  The idea came from the Netherlands, where the first repair café opened back in 2009. I'd read about it in a magazine I picked up at the dentist's, of all places, and I just couldn't stop thinking about it.

  It took me nearly a year to get going. The hall was the easy part. The parish let us have it for nothing, on the condition that we left it tidier than we'd found it. Finding people who actually knew what they were doing was much harder, and the first few months, to be honest, were mostly me and a screwdriver.

  We open on the first Saturday of every month, from ten until two. Anyone who turns up gets a number and a cup of tea, and then they wait for whichever volunteer is free. We've got about fifteen volunteers now, most of whom are retired. Engineers, a couple of dressmakers, and a man who spent forty years repairing televisions.

  What surprises people is what they bring. You'd expect laptops and phones, and we do get those, but the thing we see most often is actually the humble toaster. I've honestly lost count of the toasters. Lamps come a close second.

  My favourite repair so far was a music box belonging to a girl of about eight, whose grandmother had brought it back from Austria. It hadn't played for twenty years. The man who fixed it, Tom, spent nearly three hours on it, which is the longest anyone has ever spent on a single item, and when it finally played, half the room started clapping.

  The rule we're strictest about is that the owner has to stay and watch. We're not a shop to which you hand over your hairdryer and come back later. The whole point is that you learn something, so that next time you might be the person who does the fixing.

  Our success rate, for anyone who's curious, is about sixty-five per cent. The things we can't fix are usually those whose makers have glued the case shut, which is a design decision I'll never forgive, or items for which spare parts simply don't exist any more.

  We keep a logbook in which every single item is written down. What it was, what was wrong with it, whether we managed it. Last year that came to just over nine hundred items, which works out at roughly two tonnes of stuff that didn't end up in landfill.

  The part I didn't expect was the social side. There's one woman, Maureen, whose husband passed away the year we opened, and she's been coming every month since, whether or not she's got anything broken. She's now our unofficial head of biscuits.

  If you'd like to start one where you live, the main thing you need isn't tools. People will lend you those. It's insurance, which, believe me, is the most boring conversation you'll ever have, and also the most important.

  Right, I think we've got a few minutes for questions.
