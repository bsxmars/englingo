    answers: ["church hall", "a church hall", "hall"]
    explain: "*a repair café in a **church hall** in Limerick*. Придаточное *where people bring things that are broken* объясняет саму идею."
  - q: "Declan first read about repair cafés in a magazine at the ___."
    answers: ["dentist's", "the dentist's", "dentist", "the dentist", "dentists"]
    explain: "*a magazine I picked up at the **dentist's**, of all places* — *of all places* выражает удивление. Нидерланды — место первого кафе, а не то, где он о нём прочитал."
  - q: "The café is open on the first ___ of every month."
    answers: ["Saturday"]
    explain: "*We open on the first **Saturday** of every month, from ten until two.*"
  - q: "Most of the volunteers are ___."
    answers: ["retired"]
    explain: "*about fifteen volunteers now, **most of whom are retired*** — квантор + *whom*. Инженеры и мастер по телевизорам — примеры, а не большинство."
  - q: "The item that people bring most often is the ___."
    answers: ["toaster", "humble toaster", "toasters"]
    explain: "*the thing we see most often is actually the humble **toaster***. Ноутбуки и телефоны — ожидание слушателя, лампы — *a close second*."
  - q: "The longest single repair took almost ___."
    answers: ["three hours", "3 hours"]
    explain: "*spent nearly **three hours** on it, which is the longest anyone has ever spent on a single item* — *which* относится ко всему факту."
  - q: "The rule Declan is strictest about is that owners must ___."
    answers: ["stay and watch"]
    explain: "*the owner has to **stay and watch**. We're not a shop to which you hand over your hairdryer…* — предлог перед *which*."
  - q: "The café manages to fix about ___ per cent of the items."
    answers: ["sixty-five", "65", "sixty five"]
    explain: "*Our success rate… is about **sixty-five** per cent.*"
  - q: "The logbook recorded just over ___ items last year."
    answers: ["nine hundred", "900"]
    explain: "*a logbook **in which** every single item is written down… just over **nine hundred** items*. Две тонны — вес, а не число предметов."
  - q: "According to Declan, the most important thing to arrange when starting a repair café is ___."
    answers: ["insurance"]
    explain: "*the main thing you need isn't tools… It's **insurance**, which… is the most boring conversation*. Инструменты — ловушка: их одолжат."
