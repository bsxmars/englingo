text: |
  **Starting from zero at forty**

  When I told my friends that I had bought myself a cello for my fortieth birthday, their reactions fell into two groups. Half of them said "How wonderful!" in the voice people use for children's drawings. The other half asked, quite reasonably, why I wanted to spend my evenings producing noises that would make the neighbours complain. I didn't have a good answer for either group. All I knew was that I had wanted to play the instrument since I was eleven, when a visiting orchestra performed at my school, and that if I didn't start now, I probably never would.

  The first lesson was humbling. My teacher, a calm woman in her sixties called Ruth, spent forty minutes showing me how to hold the bow. I had assumed we would at least play a note. "Everybody wants to run before they can walk," she said, watching my frustration with what I later recognised as affection. "Adults most of all. Children don't mind being bad at things. You've had thirty years of practice at avoiding it."

  She was right, and it took me months to understand how right. As a journalist, I am used to being reasonably competent. I know how to interview a politician, how to cut a thousand words down to six hundred, how to sound confident on the radio even when I'm not. What I had forgotten was the particular discomfort of not being able to do something at all — of knowing exactly what the music should sound like and hearing something completely different come out.

  For the first few weeks, I practised in the evenings, when I was tired and easily discouraged. Progress was so slow that I almost gave up twice. It was Ruth who suggested I try practising for fifteen minutes before breakfast instead. I was sceptical — I am not a morning person — but the change made an enormous difference. My hands were fresher, my mind was clearer and, crucially, I was no longer comparing myself with the professional recordings I had been listening to all day.

  Researchers who study adult learning will tell you that this pattern is common. Adults often learn faster than children at the start, because they can follow instructions and organise their practice. Where they struggle is in tolerating the long middle stage, when improvement is real but almost invisible. Children, who are constantly learning new things, accept this as normal. Adults, who have built their lives around what they are already good at, tend to interpret it as failure.

  There were other surprises. I had expected the physical side to be difficult, and it was: for the first two months the tips of my fingers were sore, and my back ached after every session. What I had not expected was how much the cello would change the rest of my week. Because I had to practise every day, I began to protect small pockets of time that would previously have disappeared into email. I slept better. I even listened to music differently, noticing the bass line rather than the tune.

  A year on, I can play a handful of simple pieces from beginning to end, provided nobody is listening too closely. Last month I took part in a concert for Ruth's students, most of whom were under twelve. I was the tallest performer by about a metre and by far the most nervous. My piece lasted ninety seconds. I made three mistakes, one of them quite loud, and when it was over, a seven-year-old in the front row clapped so enthusiastically that she dropped her own violin.

  Would I recommend the experience? Not to everyone. If you are looking for quick results, choose something else. But if you suspect that you have become a little too comfortable — that you have stopped being a beginner at anything — I can think of few better ways to find out. Being bad at something, it turns out, is a skill in itself. And like any skill, it gets easier with practice.
