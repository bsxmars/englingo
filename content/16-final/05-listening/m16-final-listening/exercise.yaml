title: "Listening Parts 1 and 3"
type: listening
pass: 60
intro: |
  Одна запись, две части экзамена. **Part 1** (вопросы 1–8): восемь коротких отрывков, к каждому выбери лучший ответ. **Part 3** (вопросы 9–13): пять человек рассказывают, как учатся играть на музыкальном инструменте; для каждого выбери утверждение A–F, одно лишнее.

  Прослушай запись дважды, как на экзамене, и только потом проверяй. Для зачёта нужно **60 %**.
hints:
  - "Неверные варианты звучат в записи — но в другом времени, с отрицанием или о другом человеке."
  - "В Part 3 каждый говорящий упоминает несколько тем: ищи главную мысль."
