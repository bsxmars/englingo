transcript: |
  **Presenter:** My guest today is Tom Bailey, who has presented the weather on national television for fifteen years. Tom, what's a normal day like for you?

  **Tom:** It starts early. I'm at the office by half past four, and I don't leave until after the evening news. Although people think I just stand in front of a map, I actually spend most of the day with the forecasting team, going through the data.

  **Presenter:** How accurate are forecasts these days?

  **Tom:** Far more accurate than when I started. A five-day forecast today is about as reliable as a two-day forecast was in the 1990s. And the more data we get from satellites, the better our computer models become.

  **Presenter:** Is there anything that's still hard to predict?

  **Tom:** Thunderstorms. They're incredibly local. One street can get flooded while the next one stays completely dry. So when I say there's a chance of storms in the afternoon, I'm not being vague on purpose. They're genuinely unpredictable.

  **Presenter:** What do viewers ask you most?

  **Tom:** Oh, whether it'll rain on their wedding day! People stop me in the supermarket and ask if I could tell them what the weather will be like in August. I always say I have no idea, which disappoints them.

  **Presenter:** Have you ever got a forecast badly wrong?

  **Tom:** Once, early in my career. I said it would be a lovely sunny day, and a storm hit the coast that afternoon. Hundreds of people had to be helped off the beach. I must have received a thousand angry letters. My boss told me I should have checked the latest data before going on air, and he was right. I'd been looking at the morning figures.

  **Presenter:** How long will you carry on?

  **Tom:** My contract runs until the end of next year. By then I'll have been doing this for seventeen years, and I'd like to spend more time teaching. So that will probably be the end of my time on screen.

  **Presenter:** And what would you say to young people who'd like to do your job?

  **Tom:** Don't try to become famous. Learn the science first, properly. I'd also recommend getting used to speaking without notes. And remember to smile, even when the news is bad.

  **Presenter:** Tom Bailey, thank you.
