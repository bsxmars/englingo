title: "Итоговое эссе: учиться онлайн или с преподавателем"
type: writing
prompt: |
  *In your English class you have been talking about learning new skills. Now your teacher has asked you to write an essay.*

  **Is it better to learn a new skill online or with a teacher in person?**

  Notes — write about:

  1. cost
  2. motivation
  3. ……… (your own idea)

  Write your essay in **140–190** words. Try to finish in 40 minutes.
words: [140, 190]
target_grammar:
  - "связки противопоставления, причины и следствия"
  - "пассив для обобщений (can be learnt, it is often said)"
  - "relative clauses (people who…, …, which…)"
  - "модальные глаголы для смягчения (can, might, should)"
  - "одна cleft-конструкция или инверсия"
checklist:
  - "Вступление перефразирует вопрос, заключение даёт на него ясный ответ."
  - "Обе идеи из notes (cost, motivation) раскрыты в отдельных абзацах, третья идея своя."
  - "Каждый аргумент подкреплён причиной или примером."
  - "Связки разнообразные и с верной грамматикой (however после точки, despite + существительное / -ing)."
  - "Использованы минимум три темы курса: пассив, relative clause, условное или модальный глагол."
  - "Нейтральный стиль: без сокращений и разговорных слов."
  - "Объём 140–190 слов, текст написан примерно за 40 минут."
model_answer: |
  Thanks to the internet, almost any skill can now be learnt at home, often for free. But does that mean that a real teacher is no longer necessary?

  Cost is the most obvious argument for learning online. Whereas private lessons can be expensive, thousands of video tutorials are available at no charge. As a result, people who could never afford a teacher are now able to learn the guitar, programming or a foreign language.

  Motivation, however, is a different matter. Although online courses are convenient, many learners give up after a few weeks, since nobody notices if they stop. A teacher, on the other hand, expects you to turn up having practised, which is a powerful reason to keep going.

  Another point worth considering is feedback. A video cannot tell you that you are holding your hands in the wrong position, and bad habits learnt early are hard to correct later.

  In conclusion, online resources are excellent for getting started. Nevertheless, what most learners need in order to make real progress is someone who can watch them and tell them what to change.
