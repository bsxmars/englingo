    answers: ["eleven", "11"]
    explain: "*we waited **eleven** days for a single uninterrupted hour* — так трудно найти тишину без самолётов."
  - q: "When she started, a decent microphone weighed nearly ___."
    answers: ["two kilos", "2 kilos", "two kilograms", "2 kilograms", "2 kg", "2kg"]
    explain: "*a decent microphone weighed nearly **two kilos*** — *nearly* = почти; *decent* — «приличный, вполне хороший»."
  - q: "Her proudest recording is of a dawn chorus in a small wood in ___."
    answers: ["Shropshire"]
    explain: "*a dawn chorus in a small wood in **Shropshire*** — *dawn chorus* — птичий хор на рассвете. *surprisingly ordinary* — «на удивление обычная»: наречие оценивает прилагательное."
