  - q: "Dana has been recording sounds for nature documentaries for ___ years."
    answers: ["twelve", "12"]
    explain: "*for the last **twelve** years I've been recording sounds* — Present Perfect Continuous с *for the last…*: работает до сих пор."
  - q: "Most of her working time is spent waiting in a cold, wet ___."
    answers: ["hide"]
    explain: "*sitting perfectly still in a cold, wet **hide*** — *hide* — укрытие для наблюдения за животными. Прилагательные одного типа (*cold, wet*) разделяются запятой."
  - q: "Before this career, she had trained as a classical ___."
    answers: ["violinist"]
    explain: "*I'd trained as a classical **violinist*** — *classical* здесь классифицирующее прилагательное, оно стоит вплотную к существительному."
  - q: "Her first job in sound was helping to clean up old recordings of ___."
    answers: ["birdsong", "bird song", "bird-song"]
    explain: "*help clean up some old recordings of **birdsong*** — пение птиц, неисчисляемое."
  - q: "She says the hardest thing to record is ___."
    answers: ["silence", "natural silence", "genuine natural silence", "genuine, natural silence"]
    explain: "*You'd think it would be something rare… Actually, the hardest thing by far is **silence**.* Сова — догадка слушателей, ответ — после *Actually… by far*."
