level: c1
book: book-advanced
title: "C1 · 8. Прилагательные и наречия"
summary: "Ставишь несколько прилагательных в естественном порядке и с правильной пунктуацией, пишешь плотно за счёт compound adjectives, точно располагаешь наречия фокуса и ожидания, оцениваешь и смягчаешь утверждения через viewpoint и comment adverbs (financially, admittedly, arguably) и сравниваешь тонко: nowhere near as…, by far the…, the more…, the more…"
topics:
  - "Emphasizing, describing и classifying adjectives: порядок и пунктуация"
  - "Позиция прилагательных: asleep / alive, the people concerned, something unusual"
  - "Participle и compound adjectives, adjectives as nouns: the elderly, the Swiss, the unknown"
  - "Позиция наречий: mid position, already / still / no longer, focus adverbs only / even"
  - "Degree, manner, viewpoint и comment adverbs: technically, admittedly, presumably"
  - "Наречия степени: gradable и extreme adjectives, quite / rather / fairly / pretty, коллокации highly likely, bitterly disappointed, смягчители"
  - "Equatives, comparatives и superlatives на уровне C1"
sources:
  - {title: "Oxford Practice Grammar Advanced — прилагательные и наречия", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
