  - {title: "Perfect English Grammar: сравнительная степень", url: "https://www.perfect-english-grammar.com/comparative-adjectives-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
