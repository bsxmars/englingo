title: "C1 · 10. Инфинитив и герундий"
level: c1
book: book-advanced
summary: "Свободно пользуешься сложными формами — to have done, to be doing, having been done, being asked, — различаешь тонкие пары вроде go on to do / go on doing и строишь книжные конструкции с прилагательными и существительными: worth doing, likely to, the decision to, the chance of doing, it is vital for sb to."
topics:
  - "Перфектный, длительный и пассивный инфинитив; перфектный и пассивный герундий"
  - "Голый инфинитив, одно to, for sb to do, his / him doing, only to и so as not to"
  - "Глагол + объект + инфинитив или герундий; восприятие, need doing, mean, try, go on"
  - "Прилагательные с инфинитивом и герундием: it + adj + for / of sb to, worth doing, likely to, capable of"
  - "Существительные с инфинитивом и герундием: the decision to, the chance of doing, someone to ask"
sources:
  - {title: "Oxford Practice Grammar Advanced — инфинитивы и герундии", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: Gerunds and Infinitives (3)", url: "https://www.perfect-english-grammar.com/gerunds-and-infinitives-exercise-3.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
