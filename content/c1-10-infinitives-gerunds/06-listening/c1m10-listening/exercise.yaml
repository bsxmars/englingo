transcript: |
  **Presenter:** On today's programme, we're talking about putting things off. My guest is Dr Helen Marsh, who has spent fifteen years studying why we procrastinate. Helen, is it true that you started researching this because of your own habits?

  **Helen:** Guilty, I'm afraid. I remember being told by my PhD supervisor that I was the most organised person she'd ever met at avoiding work. I'd clean the kitchen, reorganise my bookshelves, anything rather than write. So in a sense, yes. But what really got me interested was noticing that it wasn't laziness. I was working extremely hard, just on the wrong things.

  **Presenter:** So if it isn't laziness, what is it?

  **Helen:** Most researchers now see it as a problem of managing emotions rather than time. We put off tasks that make us feel anxious, or bored, or not good enough. Delaying gives you instant relief. The trouble is, the relief doesn't last, and the task is still there, only now with added guilt. Interestingly, people who are afraid of being judged are far more likely to procrastinate than people who simply find a task dull.

  **Presenter:** There are endless apps and planners that promise to cure it. Are they worth using?

  **Helen:** Some are, some aren't. The problem with most planners is that they assume the difficulty is not knowing what to do. People usually know perfectly well what to do. I'd go so far as to say that making an elaborate plan can itself become a way of avoiding the work. I've seen students spend a whole afternoon colour-coding a revision timetable without opening a single book.

  **Presenter:** So what does work?

  **Helen:** The most effective technique we've found is surprisingly simple: agree to work on the task for just ten minutes. Not to finish it, just to start it. Once you've started, the anxiety tends to fade, and most people go on working well beyond the ten minutes. The other thing is to stop expecting to feel motivated before you begin. Motivation usually comes after starting, not before.

  **Presenter:** You've also written about the role of self-forgiveness. Some listeners might feel that sounds a little soft.

  **Helen:** People often react that way. But in one study, students who'd forgiven themselves for having procrastinated before their first exam were significantly less likely to do it again before the second. Being hard on yourself feels responsible, but it actually makes the task even more unpleasant to think about, and so you're more likely to avoid it next time.

  **Presenter:** Finally, has studying procrastination cured you of it?

  **Helen:** I'd love to say it had. I finished my latest book three months later than I'd promised to, and my editor was remarkably patient. But I do notice it sooner now. I catch myself tidying my desk and think, "Ah, there you are." That's not a cure, but it's a start.

  **Presenter:** Dr Helen Marsh, thank you.
