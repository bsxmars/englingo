    answers: ["owl"]
    explain: "*A stuffed **owl** was once left on the eight fifteen to Norwich… it's since been adopted by the office as a sort of mascot.*"
  - q: "The owner of the lost wedding ring was found thanks to the ___ ."
    answers: ["engraving", "the engraving"]
    explain: "*We managed to trace the owner through the **engraving**.* Само кольцо *had been lost seven years earlier* — Past Perfect passive."
