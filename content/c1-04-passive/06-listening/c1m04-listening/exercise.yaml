    explain: "*anything that might be dangerous is handed over to the **police** straight away* — модальный глагол в придаточном, пассив в главном."
  - q: "Members of the public are not permitted to search the ___ ."
    answers: ["shelves", "the shelves"]
    explain: "*members of the public aren't allowed to search the **shelves** themselves.*"
  - q: "After three months, unclaimed items are given to ___ ."
    answers: ["charity", "a charity", "charities"]
    explain: "*if they haven't been claimed, they're donated to **charity*** — Present Perfect passive в придаточном."
