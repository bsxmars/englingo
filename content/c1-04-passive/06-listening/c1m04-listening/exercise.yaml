    explain: "*Every item is logged on our database within **twenty-four hours**.*"
  - q: "On the shelves, items are organised by the ___ they were found."
    answers: ["date", "the date"]
    explain: "*stored on the shelves according to the **date** it was found, not according to what it is.*"
