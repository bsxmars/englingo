title: "Lost in amplification"
type: reading
intro: "Прочитай эссе и ответь на вопросы. Вопросы с вариантами — в формате C1 Advanced, Part 5; в остальных впиши одно слово из текста."
hints:
  - "Вопросы идут в порядке текста: сначала найди нужный абзац."
