level: c1
book: book-advanced
title: "C1 · 4. Пассив"
summary: "Строишь пассив с модальными, перфектными инфинитивами и герундиями, понимаешь, у каких глаголов пассива нет, отличаешь пассив от ergative (The door opened), уместно используешь by-phrase, get-passive и безличный стиль отчётов и новостей: it is alleged that…, there are said to be…"
topics:
  - "Модальный и перфектный пассив: could have been avoided, is going to have to be sold"
  - "Пассивные инфинитивы и герундии: to have been chosen, not having been told"
  - "Глаголы без пассива, глаголы с двумя дополнениями, фразовые глаголы"
  - "by или with, ergative verbs: The door opened, prices rose"
  - "Пассив в академическом и новостном стиле, reporting passives"
  - "get-passive: регистр и значение"
  - "Каузатив на уровне C1: had my bag stolen, get someone to do, have the audience laughing, won't have, got himself arrested, need doing"
sources:
  - {title: "Oxford Practice Grammar Advanced — пассив", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: пассив с it is said that / he is said to", url: "https://www.perfect-english-grammar.com/passive-subordinate-clauses-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
