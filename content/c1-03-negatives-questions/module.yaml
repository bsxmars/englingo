title: "C1 · 3. Отрицания и вопросы"
level: c1
book: book-advanced
summary: "Строишь отрицания и вопросы без единой «русской» ошибки, уверенно пользуешься инверсией после never, not until, under no circumstances, little did… и управляешь смыслом через отрицательные вопросы, question tags и вопросы внутри вопросов."
topics:
  - "Порядок слов в отрицаниях: not to / not -ing, no и not any, none of, not a / not all"
  - "Отрицание в тонкостях: перенос (I don't think), охват (not all, not necessarily), усиление (far from, by no means), литота"
  - "Negative words: hardly, scarcely, barely, seldom, neither / nor, no sooner… than; инверсия после отрицательных обстоятельств"
  - "Отрицательные вопросы: подтверждение, удивление, упрёк; ответы yes / no"
  - "Question tags в тонкостях: aren't I, shall we, nobody → they, теги одной полярности"
  - "What или which, предлоги в вопросах, whatever / however, вопросы внутри вопросов, эхо-вопросы, косвенные вопросы"
sources:
  - {title: "Oxford Practice Grammar Advanced — отрицания и вопросы", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: inversion, упражнение 1", url: "https://www.perfect-english-grammar.com/inversion-exercise-1.html"}
  - {title: "Perfect English Grammar: negative questions, упражнение 1", url: "https://www.perfect-english-grammar.com/negative-questions-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
