title: "Part 3: The forgery hunter"
type: listening
intro: "Послушай интервью с искусствоведом Клэр Уитлок, которая разоблачает подделки, и выбери лучший ответ. Вопросы идут по порядку записи."
hints:
  - "Инверсия после little, never, no sooner выделяет главное в реплике."
  - "far from useless, by no means convinced — ослабленное или усиленное отрицание, а не прямой ответ «да» или «нет»."
