title: "2. Будущее"
summary: "Перестаёшь говорить про будущее одним will: выбираешь между will, going to и Present Continuous, говоришь, что будешь делать и что успеешь сделать к сроку, и не ставишь will после when и as soon as."
topics:
  - "will / going to / Present Continuous / Present Simple"
  - "Future Continuous и Future Perfect"
  - "time clauses: when, as soon as, until, by the time"
  - "was going to, be about to, be due to, be likely to"
  - "Будущее в прошлом: would, was going to, was supposed to, be bound to"
sources:
  - {title: "Oxford Practice Grammar — разделы о будущем времени", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: будущие времена, смешанное упражнение", url: "https://www.perfect-english-grammar.com/future-tenses-form-mixed-exercise-1.html"}
  - {title: "Видео Vlad and English: часть 2 — будущее и модальные глаголы (уроки 19–37)", url: "https://www.youtube.com/watch?v=V-cRBDeMn6I"}
