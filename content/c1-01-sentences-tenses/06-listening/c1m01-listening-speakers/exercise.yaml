title: "Part 4: Changing course"
type: listening
intro: "Пять человек рассказывают о том, как сменили профессию во взрослом возрасте. **Задание 1** (пункты 1–5): что подтолкнуло каждого к переменам? **Задание 2** (пункты 6–10): что каждый чувствует сейчас? В каждом задании три варианта лишние."
hints:
  - "Каждый говорящий упоминает несколько вариантов — ищи причину, а не фон."
  - "Чувство «сейчас» звучит в настоящих временах и выводах в конце монолога."
