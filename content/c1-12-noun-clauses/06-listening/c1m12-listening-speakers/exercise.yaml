title: "Part 4: Taking a break"
type: listening
intro: "Ты услышишь пять коротких монологов о людях, которые на время оставили работу. Задание 1: что привело каждого к перерыву? Задание 2: что каждый понял? В каждом задании восемь вариантов, три лишние."
hints:
  - "На первом прослушивании держи в голове задание 1, на втором — задание 2."
  - "Сначала часто звучит чужая версия (Everyone assumed…), потом настоящая: The truth is that…, What I found was…"
audio: audio/tts/c1-12/speakers.mp3
audio_source: {title: "Course recording (edge-tts)", url: "https://github.com/rany2/edge-tts", author: "en-GB-SoniaNeural, en-GB-ThomasNeural, en-US-JennyNeural, en-IE-ConnorNeural, en-AU-NatashaNeural", license: "TTS"}
transcript: |
  **Speaker 1:** Everyone assumed I'd inherited money or won something, because why else would a solicitor walk away from a perfectly good job at forty? The truth is that I'd stopped believing anything I did made a difference. I'd spend a week on a contract that nobody would ever read. So I took a year off. What I hadn't expected was how cheaply I could live once I stopped paying for things to make up for being miserable. Taxis, takeaways, expensive holidays. I spent about a third of what I used to, and I honestly didn't feel I was going without.

  **Speaker 2:** My father had a fall, and somebody had to look after him while he recovered. My sister has three young kids, so it made sense that it should be me. I'd always complained about work: the meetings, the commute, the timesheets. But what I found, after a couple of months at home, was that I badly missed having a reason to be dressed by eight. Without anyone telling me where to be, the days just sort of dissolved. When Dad was back on his feet, I set up on my own, doing the same work as before. But I still start at eight sharp and finish at five, because I know now that I need that.

  **Speaker 3:** Ever since I was about nine, I'd wanted to sail across the Atlantic. It's the kind of thing you say at dinner parties and never actually do. Then a friend mentioned that a boat was looking for crew, and I thought, if not now, when? My partner was surprisingly supportive, which helped. What astonished me was that I coped. I'd always assumed I was the kind of person who panics in a crisis. Then, three weeks in, we hit a storm, the skipper was sick, and it turned out that I could stay calm and keep everyone working. I'm still not sure where that came from.

  **Speaker 4:** When the company offered voluntary redundancy, the package was so generous that it would've been foolish to turn it down. I fully intended to find another job in finance within a month. That was two years ago. What worried me most at first was what people would think. My parents, especially, kept asking when I was going to get a proper job. But the fact is that most people are far too busy with their own lives to think about yours for very long. Once I realised that, I stopped explaining myself. These days I do a bit of consultancy for my old clients, and nobody asks any more.

  **Speaker 5:** I'd been working seventy-hour weeks as a hospital administrator, and in the end my body made the decision for me. I collapsed at work, and my doctor said it was essential that I stop completely for at least six months. I was furious at the time. But during those months I started volunteering at a community garden, just to get out of the house, and I realised that what I'd really wanted, for years, was to work outdoors. I've just finished a course in horticulture. Whether I'll ever earn as much doing it, I doubt, but I genuinely don't mind.
