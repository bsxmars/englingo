title: "C1 · 12. Придаточные-существительные"
level: c1
book: book-advanced
summary: "Строишь придаточные в роли подлежащего и дополнения (What surprised me was…, That he lied is obvious), выбираешь между that, wh-, whether и the fact that, пользуешься сослагательным наклонением и should (I suggest that he be…, It is essential that…) и раскладываешь сложную информацию по придаточным, как в академическом тексте."
topics:
  - "That-clauses и wh-clauses: после глаголов, предлогов, if / whether; пропуск that"
  - "Придаточные как подлежащее, пустое it в роли подлежащего и дополнения"
  - "Whether или if, wh-слово + to-инфинитив, what / which, what little / what few"
  - "Существительные и прилагательные с придаточными: the fact that, the idea that, it's essential that"
  - "Сослагательное наклонение и should; noun clauses в академическом письме"
sources:
  - {title: "Oxford Practice Grammar Advanced — noun clauses и сослагательное наклонение", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: embedded questions in statements", url: "https://www.perfect-english-grammar.com/embedded-questions-in-statements-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
