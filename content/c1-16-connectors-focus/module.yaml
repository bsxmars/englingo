title: "C1 · 16. Связки и фокусные конструкции"
level: c1
book: book-advanced
summary: "Связываешь предложения так, как пишут в академических и публицистических текстах: различаешь however, despite и although, точно выбираешь между moreover, nonetheless, conversely и hence, а акценты расставляешь инверсией (Not until…, Little did I know…) и cleft-конструкциями (What struck me was…, It was only when… that…)."
topics:
  - "Connectors, сложные предлоги и союзы: however / despite / although, as a result / as a result of, instead / instead of"
  - "Позиция связок в предложении и пунктуация"
  - "Adding и contrasting: moreover, furthermore, besides, nonetheless, on the contrary, conversely, in fact, after all"
  - "Result, time и listing: consequently, hence, thereby, meanwhile, subsequently, for a start, last but not least"
  - "Fronting и инверсия: Not until…, Little did I know…, Only by…, So … that…, Such was…"
  - "Cleft sentences: It was … that…, What … was…, All … is…, The thing that…"
  - "Cleft в деталях: согласование, What X did was…, The reason… is that, обратный cleft (That's where…); эмфатическое do / does / did"
  - "Эссе C1 Advanced"
sources:
  - {title: "Oxford Practice Grammar Advanced — connectors and focus structures", url: "https://elt.oup.com/catalogue/items/global/grammar_vocabulary/oxford_practice_grammar/"}
  - {title: "Perfect English Grammar: Inversion", url: "https://www.perfect-english-grammar.com/inversion-exercise-1.html"}
  - {title: "Perfect English Grammar: Linking Words of Contrast", url: "https://www.perfect-english-grammar.com/linking-words-contrast-exercise-1.html"}
  - {title: "Cambridge C1 Advanced — формат экзамена", url: "https://www.cambridgeenglish.org/exams-and-tests/advanced/"}
