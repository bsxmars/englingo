title: "Part 2: A night at the dark sky park"
type: listening
intro: "Послушай вступительную беседу в парке тёмного неба и впиши в каждый пропуск одно–три слова, которые прозвучали в записи."
hints:
  - "Связки предупреждают, что будет дальше: however — поворот, as a result и consequently — следствие, moreover — ещё один довод."
  - "Числа можно писать цифрами или словами."
