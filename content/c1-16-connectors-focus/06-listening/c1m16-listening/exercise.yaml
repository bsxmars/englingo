title: "Part 4: Learning a craft"
type: listening
intro: |
  Пять человек рассказывают о ремесле, которым занялись уже взрослыми. В **Task 1** выбери, почему каждый начал, в **Task 2** — что каждого удивило больше всего. В каждой задаче три варианта лишние.
hints:
  - "Cleft-конструкции выносят главное в конец: What got me started was…, The thing it's changed most is…"
  - "Лишний вариант звучит с отрицанием или оговоркой: Everyone assumes…, that's not what struck me, I can't honestly say…"
