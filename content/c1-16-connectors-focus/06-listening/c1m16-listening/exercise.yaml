transcript: |
  *Speaker one.*

  Everyone assumes I took up pottery to cope with stress at work, but actually, what got me started was a smell. I walked past a studio one evening, and the smell of wet clay took me straight back to my grandmother's garden shed, where I used to spend whole summers making lopsided pots. I signed up that same week. Not until I'd ruined about forty bowls did I realise that every collapse was teaching me something, about pressure, about speed, about when to stop. These days, when a pot goes wrong, I'm almost pleased. It's the failures I've learnt the most from.

  *Speaker two.*

  My sister was expecting her first baby, and I'd decided, rather rashly, that I'd knit her a blanket. Never before had I held a pair of knitting needles. People warned me it would take endless patience, and it does take some, but that's not what struck me. What I hadn't expected was the social side. The group I joined meets in the back room of a pub every Tuesday, and far from being a quiet, solitary hobby, it's the loudest evening of my week. I've made more friends there in two years than I did in ten at work.

  *Speaker three.*

  It was my physiotherapist who suggested woodturning, after I'd had an operation on my shoulder. She said I needed something that would rebuild strength gradually, and, moreover, something I'd actually want to do every day. The thing it's changed most, oddly, is how I shop. Having made a salad bowl myself, I just can't bring myself to pay three dollars for a mass-produced one. Conversely, I'll now happily spend a small fortune on something handmade, because I know exactly how many hours went into it. My husband thinks it's a very expensive kind of therapy.

  *Speaker four.*

  I spend ten hours a day in front of a screen, so what I wanted was something with no undo button. Calligraphy seemed perfect. I didn't go into it to meet people. In fact, I practise alone at the kitchen table. Little did I know how slow it would be, though. Only after a full year could I write my own name without wincing. Some people in my online forum say it's improved their concentration at work. I can't honestly say that's been the case for me. What it has taught me is to wait, and to keep going when nothing seems to change.

  *Speaker five.*

  A friend gave me a bookbinding kit for my fortieth birthday, as a joke, I think, because I'd once said I'd love to make my own notebooks. I'd seen it done on television years before but never tried. What astonished me was how quickly it came. Within a month I was making notebooks good enough to give away, and by Christmas, people were asking to buy them. Admittedly, the leather and the good paper aren't cheap. Nonetheless, I'd say it's the most satisfying present anyone has ever given me, joke or not.
