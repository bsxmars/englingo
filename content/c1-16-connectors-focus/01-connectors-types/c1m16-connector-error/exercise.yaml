title: "Найди ошибку: связки, предлоги и союзы"
type: error
intro: "В каждом предложении **одна** ошибка: связка на месте союза, предлог без дополнения, неверная позиция или склеенные запятой предложения. Исправь её минимальной правкой и отправь предложение целиком."
hints:
  - "however не соединяет два предложения через запятую: нужна точка, точка с запятой или союз but."
  - "После despite, as a result of, in addition to — существительное или -ing, а не полное предложение."
  - "Связка не встаёт между глаголом и дополнением."
items:
  - q: "The project ran well over budget, however it was completed on schedule."
    answers:
      - "The project ran well over budget; however, it was completed on schedule."
      - "The project ran well over budget. However, it was completed on schedule."
      - "The project ran well over budget, but it was completed on schedule."
      - "The project ran well over budget, yet it was completed on schedule."
      - "The project ran well over budget; it was, however, completed on schedule."
    explain: "*however* — связка, а не союз: запятой два предложения не соединить (comma splice). Нужна точка с запятой или точка перед *however* — либо союз *but*."
  - q: "Despite the economy was slowing, the central bank raised interest rates."
    answers:
      - "Despite the fact that the economy was slowing, the central bank raised interest rates."
      - "In spite of the fact that the economy was slowing, the central bank raised interest rates."
      - "Despite the economy slowing, the central bank raised interest rates."
      - "In spite of the economy slowing, the central bank raised interest rates."
      - "Although the economy was slowing, the central bank raised interest rates."
      - "Even though the economy was slowing, the central bank raised interest rates."
      - "Though the economy was slowing, the central bank raised interest rates."
    explain: "После предлога *despite* не может стоять придаточное с глаголом. Варианты: *Despite the fact that…*, *Despite the economy slowing…* или союз *Although…*"
  - q: "As a result of the factory closed, the town lost its main employer."
    answers:
      - "As a result of the factory closing, the town lost its main employer."
      - "As a result of the factory's closing, the town lost its main employer."
      - "As a result of the factory's closure, the town lost its main employer."
      - "As a result of the closure of the factory, the town lost its main employer."
      - "Because the factory closed, the town lost its main employer."
      - "When the factory closed, the town lost its main employer."
    explain: "*as a result of* — предлог, ему нужно существительное или *-ing*: *the factory closing / the factory's closure*. Либо замени предлог союзом: *Because the factory closed…*"
  - q: "Our hosts were extremely generous. They brought also a selection of local cheeses."
    answers:
      - "Our hosts were extremely generous. They also brought a selection of local cheeses."
      - "Our hosts were extremely generous. They brought a selection of local cheeses as well."
      - "Our hosts were extremely generous. They brought a selection of local cheeses too."
    explain: "Связка не встаёт между глаголом и дополнением. *also* — перед смысловым глаголом (*also brought*), *as well* и *too* — в конце."
  - q: "Too, the report highlights several gaps in staff training."
    answers:
      - "The report also highlights several gaps in staff training."
      - "Also, the report highlights several gaps in staff training."
      - "The report highlights several gaps in staff training too."
      - "The report highlights several gaps in staff training as well."
      - "In addition, the report highlights several gaps in staff training."
    explain: "*too* и *as well* в начало предложения не ставят. В начале — *Also* или *In addition*, в середине — *also highlights*, в конце — *too / as well*."
  - q: "He didn't apologise for the delay. He blamed the rest of the team instead of."
    answers:
      - "He didn't apologise for the delay. He blamed the rest of the team instead."
      - "He didn't apologize for the delay. He blamed the rest of the team instead."
    explain: "*instead of* — предлог и требует дополнения. Без дополнения в конце предложения нужен connector **instead**."
  - q: "In addition that, the new system cuts processing time by half."
    answers:
      - "In addition to that, the new system cuts processing time by half."
      - "In addition to this, the new system cuts processing time by half."
      - "In addition, the new system cuts processing time by half."
    explain: "Либо connector без дополнения (*In addition, …*), либо предлог с местоимением: *In addition **to** that*. Формы ~~in addition that~~ нет."
  - q: "The trial was supposed to end in May, however didn't."
    answers:
      - "The trial was supposed to end in May but didn't."
      - "The trial was supposed to end in May, but didn't."
      - "The trial was supposed to end in May, but it didn't."
      - "The trial was supposed to end in May; however, it didn't."
      - "The trial was supposed to end in May. However, it didn't."
    explain: "Опустить подлежащее можно после союза (*but didn't*), но не после связки. С *however* нужно полное предложение: *However, it didn't.*"
  - q: "The climbers were stranded on the ridge for three days, nevertheless but they survived."
    answers:
      - "The climbers were stranded on the ridge for three days, but nevertheless they survived."
      - "The climbers were stranded on the ridge for three days but nevertheless survived."
      - "The climbers were stranded on the ridge for three days, but they nevertheless survived."
      - "The climbers were stranded on the ridge for three days, but they survived nevertheless."
      - "The climbers were stranded on the ridge for three days; nevertheless, they survived."
      - "The climbers were stranded on the ridge for three days. Nevertheless, they survived."
    explain: "Союз и связку можно сочетать, но порядок жёсткий: сначала союз, потом связка — **but nevertheless**."
  - q: "On the contrary to popular belief, bats are not actually blind."
    answers:
      - "Contrary to popular belief, bats are not actually blind."
    explain: "Предлог «вопреки» — **contrary to** без *on the*. *On the contrary* — связка, которая опровергает предыдущее утверждение: *He isn't lazy. On the contrary, he works too hard.*"
  - q: "The lab results were ambiguous. Consequently of this, the trial was suspended."
    answers:
      - "The lab results were ambiguous. Consequently, the trial was suspended."
      - "The lab results were ambiguous. As a consequence of this, the trial was suspended."
      - "The lab results were ambiguous. As a result of this, the trial was suspended."
      - "The lab results were ambiguous. Because of this, the trial was suspended."
      - "The lab results were ambiguous. As a consequence, the trial was suspended."
    explain: "*consequently* — наречие-связка, к нему не присоединяют *of this*. Либо *Consequently, …*, либо предлог: *As a consequence of this, …*"
